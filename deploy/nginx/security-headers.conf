# 安全响应头：被 deepdemos.conf 的每个 location 各自 include 一次。
#
# 为什么要拆成文件：nginx 的 add_header 是**整体继承**——只要某个 location 里写了
# 一条 add_header，server 级的所有 add_header 就全部失效。把这一组头放进 include，
# 每个自己加缓存头的 location 再 include 一遍，就不会静默丢掉 CSP。
#
# 这份策略对应 OWASP CSP Cheat Sheet 的「收紧的非严格策略」（strict-dynamic 之外
# 最实用的一档）：
#   - 没有内联脚本：web/index.html 只有 <script type="module" src>，构建产物也是外链
#   - 没有内联样式：唯一的 style 属性（Skeleton 的宽度）已改成 Tailwind 类
#   - 同源资源够用：字体、图片、预览 iframe 都在本站
# 将来真要加内联脚本/样式，先改成外链或 nonce，不要往这里加 'unsafe-inline'。

# 默认只允许同源；显式的 default-src 让漏写的指令都落到同一档兜底上
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# 不要嗅探 MIME：预览与下载端点自己也会设，这里是全站兜底
add_header X-Content-Type-Options "nosniff" always;

# 跨站时只带域名，不带完整路径（详情页 URL 里带 slug，泄露出去等于泄露用户在看什么）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 关掉用不上的能力；将来要开摄像头/麦克风再逐项放开
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# HSTS 只在确认全站 HTTPS 可用之后再加，而且要一次到位（先短后长会留 downgrade 窗口）。
# 现在先注释掉，等证书与跳转都验过再打开：
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
