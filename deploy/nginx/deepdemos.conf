# DeepDemos Showcase —— 生产反向代理与静态站
#
# 放这里：/etc/nginx/conf.d/deepdemos.conf（Debian/Ubuntu 的 sites-available 亦可，
# 记得软链到 sites-enabled）。
#
# 本机没有装 nginx，这份配置**没有在本机执行过**；部署机上必须先 `nginx -t`。
# 静态文件门禁 `scripts/check-deploy.mjs` 只证明了「关键的几行还在」，
# 证明不了语法、也不证明行为——见 docs/部署.md 的验证清单。
#
# 三条路由分工：
#   /api/ /healthz /preview/ /download/  → Go 服务
#   其余                                 → web/dist 的静态文件，找不到就回 index.html（SPA 路由）

upstream deepdemos_api {
    # PORT 的默认值是 8080（backend/internal/platform/config/config.go）
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP 只用来跳转；证书就绪后把 80 换成「全部跳 443」，别在同一份配置里
# 既开明文又开 TLS——浏览器与爬虫都会把明文那半当成正式站点。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt 的 http-01 校验走这里，放在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # 证书路径按实际部署改；没有证书时把整个 443 server 注释掉，只留 80（见 docs/部署.md）
    ssl_certificate     /etc/letsencrypt/live/deepdemos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepdemos/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 上传上限：契约允许 200 MiB 的压缩包，这里留一点余量给 multipart 头
    client_max_body_size 220m;
    client_body_timeout  300s;

    # 静态站根目录：`npm run build` 之后的 web/dist
    root  /srv/deepdemos/web;
    index index.html;

    # gzip：文本类才压，图片/zip 再压是白烧 CPU
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # 安全响应头单独成文件：add_header 在 location 里会**整体覆盖** server 级，
    # 所以每个自己加了 Cache-Control 的 location 都必须再 include 一次。
    # （这是 nginx 的继承规则，踩过才知道不是 bug。）
    include /etc/nginx/conf.d/deepdemos-security-headers.conf;

    # ---- 后端：契约端点 ----
    location /api/ {
        proxy_pass http://deepdemos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 服务端只按白名单解析 XFF（httpapi.clientIP 的注释），这里照实转发原值
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 200 MiB 投稿不要让 nginx 先落盘再转发
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    location = /healthz {
        proxy_pass http://deepdemos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/conf.d/deepdemos-security-headers.conf;
        # 健康检查不要被缓存成「昨天是健康的」
        add_header Cache-Control "no-store";
    }

    # ---- 后端：预览与下载（不是契约端点，见 httpapi/preview.go 顶部说明）----
    # 预览要给 iframe 用，所以这两处不能套 frame-ancestors 'none'；
    # 预览响应自己带 sandbox CSP（preview.go），那才是真正的隔离边界。
    location /preview/ {
        proxy_pass http://deepdemos_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location /download/ {
        proxy_pass http://deepdemos_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 断点续传：Range 由后端处理，nginx 不要自己切
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ---- 前端：带哈希的产物可以长缓存 ----
    location /assets/ {
        include /etc/nginx/conf.d/deepdemos-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能长缓存：它是唯一指向新哈希文件的入口
    location = /index.html {
        include /etc/nginx/conf.d/deepdemos-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # ---- 前端：SPA 路由（/demos/xxx、/rankings、/admin/models …）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
