openapi: 3.0.3

info:
  title: DeepDemos API
  version: 0.1.0
  description: |
    本文件是**接口的唯一事实源**。改接口先改这里，再跑生成，再改实现；不要手改生成目录。

    当前范围：站点可用性、作品列表与详情、身份（注册 / 邮箱验证 / 登录 / 登出 / 我是谁 /
    发验证码 / 找回密码），共 18 个端点。实现全部已接入并有集成测试覆盖。

    不在契约里的两个端点：`GET /preview/{slug}/*` 与 `GET /download/{slug}`。
    它们的响应体是 HTML / zip 字节而不是 JSON，「所有端点返回 JSON、错误有统一 ErrorBody」
    这条前提对它们不成立。判定逻辑在 `backend/internal/httpapi/preview.go` 与 `download.go`。

    这份描述会随端点增加而更新——它长期停在「三个端点」正是 `api/surface.json` 基线
    不自动成长的症状（见 `docs/已知松点.md` 第 18 条）。

    写成中文的部分是给人看的说明；`description` 会进入生成的注释，所以也写中文。

    **为什么是 3.0.3 而不是 3.1**：选 3.1 时没有验证工具链。实测 `oapi-codegen` v2.5.0
    至今不支持 3.1（上游 issue #373），3.1 的 `type: [string, 'null']` 写法会直接生成失败；
    若改用 3.0 的 `nullable` 关键字又会让文件既不是 3.1 也不是 3.0。
    两者取其一是干净的：降到 3.0.3。3.1 相对 3.0 的主要增益（webhooks、
    JSON Schema 2020-12 对齐）本项目当前一点没用到，降级不损失表达力。

servers:
  - url: /
    description: 同域反代（Nginx 静态 + Go API）

tags:
  - name: 系统
    description: 运行状态检查
  - name: 作品
    description: 作品列表与详情
  - name: 身份
    description: 会话与当前登录者

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [系统]
      summary: 站点可用性
      description: |
        返回站点是否可用。**不得携带任何配置值、账号信息或内部依赖细节**（SET-006）。
        核心资料暂不可访问时应当返回非 200，而不是 200 加一个字段说明——运行检查只看状态码。
      responses:
        '200':
          description: 站点可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthz'
        '503':
          description: 站点不可用（核心资料暂不可访问）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos:
    get:
      operationId: listDemos
      tags: [作品]
      summary: 作品列表
      description: |
        分页返回已公开的作品。分页参数口径与治理域 §P5 一致：默认 50，上限 200。
        超过上限直接 400，不静默截断——静默截断会让调用方以为拿到了全部。
      parameters:
        - name: q
          in: query
          description: 关键词，匹配标题与描述
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          description: |
            排序口径。目前只有「最新」一种——`hot` 需要热度数据（浏览/收藏/评分），
            那批指标还没落地，所以先不放进枚举：契约里有的值必须真能算出来。
          schema:
            type: string
            enum: [latest]
            default: latest
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoList'
        '400':
          description: 参数非法（含 pageSize 超上限）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: submitDemo
      tags: [作品]
      summary: 投稿（multipart，连文件一起上传）
      description: |
        需要登录。一次请求同时提交元数据与作品文件，由服务端校验、解压、落库、上传。

        **为什么是后端中转而不是预签名直传**：直传有三个失败点（签名过期、传一半断、
        确认丢失），每个都要额外清理孤儿对象；本期没有带宽压力，中转把失败点收敛成一个。
        等带宽成为瓶颈时再换，契约形状不用改——客户端仍然是「一次提交」。

        `package` 支持两种形态：
        - 一个 zip 包，**包根必须有 `index.html`**
        - 单个 `.html` / `.svg` 文件

        服务端闸门（数值见 `docs/运行手册-可变常量.md` §3）：包体积、解压后体积、
        成员数、压缩比四道，任一不过即 422。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, demoType, package]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                demoType:
                  type: string
                  maxLength: 32
                  description: |
                    作品类型。取值见 `demo_types` 表——它是主数据，**加一种类型是加一行
                    数据，不是改契约**，所以这里不定 enum。
                package:
                  type: string
                  format: binary
                  description: 作品文件（zip 或单个 html/svg）
      responses:
        '201':
          description: 已接收，进入待审核（对外不可见）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: 参数非法（缺字段、标题过长、类型未知）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 包体积超过上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 文件类型不支持（既不是 zip 也不是 html/svg）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 包内容不合格（缺 index.html、压缩炸弹、成员过多等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 待审作品太多（`UPLOAD_MAX_PENDING`），等审核消化一些再来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 存储或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}:
    get:
      operationId: getDemo
      tags: [作品]
      summary: 作品详情
      description: |
        `slug` 的格式与长度来自 `db/schema/30-demo.sql` 的 `ck_demos_slug_len`（1–128）。

        **404 的语义要和墓碑口径一致**：曾经公开过、后来被作者归档或被管理员移除的作品，
        仍然返回 200 的墓碑态（标题等字段可空、带 `lifecycleState`），不返回 404；
        只有「从未公开过」或「已擦除」才返回 404。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 详情；曾公开过但已归档/移除的返回墓碑态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDetail'
        '404':
          description: 不存在，或从未公开过，或已擦除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: updateDemo
      tags: [作品]
      summary: 更新作品（追加新版本，等复审）
      description: |
        需要登录，且只有作者本人能调用（不是作者一律 404——403 会说「这个 slug 存在」）。

        **更新不是就地改，是追加一个版本**：`demo_revisions` 有不可变触发器，
        审核过的内容必须能原样追溯。新版本的 `revNo` 是当前最大版本号 + 1。

        **旧版本继续对外服务**：新版本落在 `demos.current_revision_id` 并把审核态打回
        `pending`，而对外内容由 `published_revision_id` 决定——要等管理员通过才切换。
        所以作者改稿期间，作品在作品库、详情页、预览、下载里都还是上一版。
        这是「审核」与「下线」的区别：改稿不该让线上作品消失。

        `package` 可以不传，表示**只改标题与简介**：新版本的清单是上一版的整表复制，
        每个文件指向同一份 blob，磁盘零新增。

        传了 `package` 才能改 `demoType`——类型是内容决定的；只改文字却把 web 改成 zip，
        会让下载与预览指着不同的事实（400）。被平台移除（`removed`）的作品不允许
        作者自行改回（409）。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                demoType:
                  type: string
                  maxLength: 32
                  description: |
                    作品类型。**只有同时上传 `package` 时才能改**。
                package:
                  type: string
                  format: binary
                  description: 新的作品文件；不传表示只改文字
      responses:
        '200':
          description: 新版本已追加，进入待审核（对外仍是上一版）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: 参数非法（缺标题、只改类型没传包、作品没有版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或不是当前调用者的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 作品已被平台移除，作者不能再改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 包体积超过上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 文件类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 包内容不合格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 存储或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteDemo
      tags: [作品]
      summary: 删除作品（软删，可恢复）
      description: |
        写 `deleted_at` 并把作品目录入 GC 队列。**不改可见性层**：下架时删的，
        恢复后还是下架。

        删除后作品**对外不存在**（详情也是 404，不给墓碑——墓碑等于承认这里有过东西），
        只有作者本人能看到「已删除 · 可恢复」。

        恢复窗口在删除这一刻定型：响应里的 `purgeAfter` 就是最晚可恢复时刻，
        之后恢复一律 409（`restore_window_closed`）。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoDeleteRequest'
      responses:
        '200':
          description: 已删除，带最晚可恢复时刻
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDeleteResult'
        '400':
          description: 请求体不是合法 JSON，或理由过长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或者不是你的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 已经删过了 / 已被平台移除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/archive:
    post:
      operationId: archiveDemo
      tags: [作品]
      summary: 下架作品（作者本人）
      description: |
        `published → archived`。下架后：作品库不再出现、详情返回墓碑页（200，只有标题与
        「作者已下架」）、预览与下载 404。**渠道行不动**——下架不是删渠道，重新上架后
        渠道仍在原来的可见性上。

        这是作者自己的动作，见不到别人的作品（非作者一律 404，不返回 403：403 会承认
        这个 slug 存在过）。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLifecycleResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或者不是你的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 当前状态不允许下架（不是已发布、已被平台移除）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/unarchive:
    post:
      operationId: unarchiveDemo
      tags: [作品]
      summary: 重新上架（作者本人）
      description: |
        `archived → published`。不发通知、不改渠道、不动对外版本——上架只改变可见性。

        「被平台移除」（`removed`）的作品不能自己上架，那是治理域的处置。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已重新上架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLifecycleResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或者不是你的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 当前状态不允许（不是已下架、已被平台移除）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/restore:
    post:
      operationId: restoreDemo
      tags: [作品]
      summary: 恢复已删除的作品（作者本人）
      description: |
        清空 `deleted_at`，作品回到删除前的档位（下架时删的，恢复后还是下架）。
        不返回 403：**恢复窗口过期**与**文件已被回收**都是 409，但错误码不同——
        前者是「你来晚了」，后者是「系统提前清掉了」。

        路径与 `POST /demos/{slug}/revisions/{revNo}/restore` 分开：那个恢复的是
        **内容版本**，这个恢复的是**被删掉的作品**。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLifecycleResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在、不是你的、或已被擦除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 没被删过 / 恢复窗口已过（`restore_window_closed`）/ 文件已被回收（`derivative_purged`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/revisions:
    get:
      operationId: listDemoRevisions
      tags: [作品]
      summary: 版本历史
      description: |
        需要登录。作者看自己的，审核员看任意作品的（`demo.review`）；其他人一律 404。

        **为什么不做成公开端点**：列表里有「哪一版还没过审」这类只有作者与审核员该知道的信息。
        访客看到的内容永远由 `published_revision_id` 决定，不需要版本列表。

        新的在前。`isCurrent` / `isPublished` 由两个指针直接比出来，不是在应用层推的。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或调用者既不是作者也没有审核权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/revisions/{revNo}/restore:
    post:
      operationId: restoreDemoRevision
      tags: [作品]
      summary: 回滚到某一版
      description: |
        需要登录且是作者本人（不是作者一律 404）。

        **回滚是「追加」不是「撤销」**：新版本 `source=rollback`、清单整表复制目标版本
        （同一批 blob，零字节写入），版本号是当前最大值 + 1。历史一行不删——
        所以它失败安全：新版本没建出来的话，原来的对外版本一个字节都没动。

        回滚产生的新版本同样要过审：`current_revision_id` 指过去、审核态打回 `pending`，
        对外内容仍是 `published_revision_id` 那一版。**回滚不会让作品重新上线**，
        也不会让线上内容立刻变回旧版。

        拒绝的情况：作品不存在/不是作者/已删已擦（404）、被平台移除（409）、
        目标版本被擦除或删除（404）、目标版本就是当前版本（400）。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
        - name: revNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 新版本已追加，进入待审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '400':
          description: 版本号非法，或目标版本就是当前版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品或版本不存在，或不是当前调用者的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 作品已被平台移除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      tags: [身份]
      summary: 验证邮箱
      description: |
        消费验证码，把账号从 `pending` 推到 `active`，并给主邮箱盖上 `verified_at`。

        **成功后不自动登录**：这一步证明的是邮箱归属，不是身份。用户拿着刚验证过的
        邮箱再登录一次，才拿到会话——两个动作各自只做一件事。

        已经验证过的账号再提交一次直接返回 204（幂等，不消费码）：用户可能刷新页面
        重提交，回一句「验证码不对」只会让他以为码坏了。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: 验证通过（或本来就已通过）
        '400':
          description: 邮箱格式不对或没填验证码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 验证码不对或已过期（`code` 为 `unauthorized`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 尝试太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email/resend:
    post:
      operationId: postAuthVerifyEmailResend
      tags: [身份]
      summary: 重发验证邮件
      description: |
        给还没验证的账号再发一封。与发登录验证码共用同一套 IP 配额
        （每个 IP 每小时 20 封）——换个邮箱就是新额度的话，1000 个邮箱等于没有上限。

        **一律 204**：账号不存在、已注销、或邮箱本来就验证过，都走一遍生成与限流，
        只是不投递。响应形状与账号是否存在无关，所以这个端点探不出谁注册过。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
      responses:
        '204':
          description: 已受理（无论账号是否存在、是否真的投递）
        '400':
          description: 邮箱格式不对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags: [身份]
      summary: 注册
      description: |
        建账号并发一封验证邮件。**注册完不是登录态**：账号落在 `pending`，要先去
        `POST /api/v1/auth/verify-email` 证明邮箱是自己的，之后才能登录。

        为什么这么设计：没有这一步时「邮箱」只是用户随手敲的字符串，抢注别人的邮箱
        会让真正的主人在注册时撞 409，更麻烦的是找回密码——重置码寄往一个不属于
        注册者的地址，账号直接变砖。

        **邮箱与用户名都不区分大小写判重**（数据库上是 `lower(...)` 唯一索引），
        所以 `Alice` 与 `alice` 会撞 409，而不是建出两个账号。

        密码只以 argon2id 哈希入库，接口从不回显。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: |
            账号已建，验证邮件已发出。**不下发会话**——见上面的说明。

            `verificationSent` 为 `false` 时账号也是真的建好了，只是信没发出去
            （SMTP 抖动）。前端应提示用户去验证页点「重新发送」，而不是让他重填表单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAccepted'
        '400':
          description: 输入不合法（邮箱格式、密码长度、用户名规则）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 邮箱或用户名已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [身份]
      summary: 登录
      description: |
        `identifier` 可以是邮箱或用户名，都不区分大小写。

        **失败一律 401，不区分「没这个账号」与「密码错」**——区分了就等于提供一个
        免费的账号枚举接口。标识符不存在时也会跑一次同等代价的哈希校验，避免用
        响应时间把注册邮箱探出来。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，`Set-Cookie` 下发新会话
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: 账号或密码为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            账号或密码不对（不区分「没这个账号」与「密码错」）。

            当这个标识符在 10 分钟内失败达到 5 次时，服务端会要求邮箱验证码：
            此时即使密码正确也返回 401，`code` 为 `verification_required`。
            该判定**只看标识符的失败次数，不看账号是否存在**——所以它不能用来
            判断某个邮箱有没有注册过。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 尝试太频繁（身份域 §11.3 的三层限流）
          headers:
            Retry-After:
              schema: { type: integer }
              description: 建议等待的秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/email-code:
    post:
      operationId: postAuthEmailCode
      tags: [身份]
      summary: 申请登录验证码
      description: |
        `identifier` 与登录时填的一致（邮箱或用户名，不区分大小写）。

        **无论该标识符有没有对应账号，都返回 204**——账号不存在时不发信，但响应形状
        完全相同，否则这里就成了免费的账号枚举接口。

        发送频率限制在 1 次/分钟、5 次/小时；超限返回 429，这个也只看标识符，
        与账号是否存在无关。

        验证码投递到该账号的**主邮箱**，6 位数字，5 分钟内有效，一次性。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 已受理（不表示账号存在，也不表示信件一定送达）
        '400':
          description: 标识符为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库或邮件通道不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset/code:
    post:
      operationId: postAuthPasswordResetCode
      tags: [身份]
      summary: 申请找回密码验证码
      description: |
        只认**邮箱**，不认用户名——用户名是公开的，用它发起重置等于给攻击者
        一个「知道昵称就能骚扰到人」的入口。

        **无论该邮箱有没有注册，都返回 204**：不存在的邮箱同样会走一遍生成与
        频率限制，只是不投递。响应形状与账号是否存在无关。

        验证码发到主邮箱，6 位数字，5 分钟有效，一次性。与登录验证码**不能混用**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCodeRequest'
      responses:
        '204':
          description: 已受理（不表示邮箱注册过，也不表示信件一定送达）
        '400':
          description: 邮箱格式不对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库或邮件通道不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [身份]
      summary: 用验证码重设密码
      description: |
        验证码、改密码、吊销旧会话在**同一个事务**里完成。

        成功后该账号在本次重置之前签发的**所有会话立即失效**——这是「密码可能
        已经泄露」场景下的关键一步，只改哈希不踢会话等于没改。

        验证码错误、过期、超次数、邮箱不存在，一律 401，不区分原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已重置，旧会话全部失效
        '400':
          description: 邮箱格式不对、新密码长度不合格或验证码为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 验证码不对或已失效（不区分具体原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [身份]
      summary: 登出
      description: |
        吊销服务端会话并清掉 cookie。**幂等**：没带 cookie、会话已失效、ID 是伪造的，
        一律返回 204——登出失败对用户没有可执行的动作，而「这个会话不存在」
        又是一个可以拿来做探测的信号。
      responses:
        '204':
          description: 已登出（无论之前是否有有效会话）

  /api/v1/me:
    get:
      operationId: getMe
      tags: [身份]
      summary: 当前登录者
      description: |
        会话是**服务端**的：cookie 只装不透明串，服务端每次查 `web_sessions`，
        所以登出能让 cookie 立刻失效。「没带 cookie / 不存在 / 过期 / 已吊销」
        **故意都 401 且不区分**——区分了等于送一个免费的会话探测器。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/reviews/demo:
    get:
      operationId: listDemoReviewQueue
      tags: [治理]
      summary: 待审作品队列
      description: |
        只列 `moderation_state = 'pending'` 的作品，按提交时间正序（先来先审）。

        需要 `demo.review` 权限。权限来自 `accounts.role` 经 `role_permissions` 展开，
        **不是**「登录了就能看」——审核队列里有未公开内容，见预览端口径。

        队列项带 `previewPath`：审核员用它打开作品内容（该路径对持 `demo.review`
        的角色开放未发布作品，见 `GET /preview/{slug}/v{rev}/{path}`）。
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.review 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/reviews/demo/{slug}:
    post:
      operationId: reviewDemo
      tags: [治理]
      summary: 审核裁决
      description: |
        把作品从 `pending` 推到 `approved` 或 `rejected`。

        **只有 `pending` 能裁决**：已经裁决过的一律 409。这不是为了省事——
        `approved → 其它` 会被 `trg_demos_guard` 拦住（有 `listed` 渠道时不允许撤下），
        与其让调用方撞数据库异常，不如在这里明确拒绝，并指向「下架」那个端点。

        裁决与两处留痕在**同一个事务**里：`demo_timeline`（写给人看的经过）与
        `audit_log`（谁、什么时候、改前改后）。任何一处失败整体回滚——
        「状态改了但没人知道是谁改的」比「没改」更难查。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: 已裁决
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400':
          description: 请求体不合法（决定值不在枚举内 / reason 过长）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.review 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 该作品不处于待审状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/demos/{slug}/publish:
    post:
      operationId: publishDemo
      tags: [治理]
      summary: 发布作品
      description: |
        把作品从 `draft`（或 `archived`，即作者下架后恢复）推到 `published`，
        并在同一个事务里落一行 `demo_channels`。

        **审核通过 ≠ 已发布**（Demo 域 §6.1）：`moderation_state='approved'` 只说明
        内容合规，`lifecycle_state` 与渠道行才决定它对外能不能看到。这个端点只做后者。

        拒绝的三种情况，分开返回：
        - 作品不存在（含软删、擦除）→ 404
        - 内容还没通过审核 → 409，`message` 指明「先审」
        - 已经是 `published` → 409（同渠道重复发布不叠加）
        - 追加到**另一个渠道**（如 deep 之后再加 astra）当前不支持：本端点只接受
          `draft` / `archived` 状态，发布一次后状态即为 `published`。要加第二渠道得
          新增一个「上架到渠道」端点，见已知松点
        - `removed`（违规下架）→ 409，只能走申诉，不能直接发

        `visibility='listed'` 还要求父作品 `approved`——已在上面的 409 里挡过；
        数据库的 `trg_demo_channels_listed_requires_approved` 是兜底，不是第一道。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '400':
          description: 请求体不合法（渠道为空 / 可见性不在枚举内 / lang 不在枚举内）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.publish 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态不允许发布（未审核 / 已发布 / 已违规下架）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [not_found, invalid_param, forbidden, unauthorized, conflict, rate_limited, unavailable, verification_required, email_not_verified, payload_too_large, restore_window_closed, derivative_purged]
          description: 机器可判别的错误码；`message` 只给人看，不要拿来做判断
        message:
          type: string
          description: 中文说明，可直接展示

    Healthz:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    DemoSummary:
      type: object
      additionalProperties: false
      required: [slug, title, coverUrl, createdAt, lifecycleState]
      properties:
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          nullable: true
          maxLength: 200
          description: 墓碑态为 null
        coverUrl:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    DemoRevision:
      type: object
      additionalProperties: false
      required: [revNo, title, demoType, source, fileCount, totalBytes, createdAt, deleted, erased, isCurrent, isPublished]
      description: |
        版本列表里的一行。

        `isCurrent` 是作者正在改的那一版（可以是未过审的），`isPublished` 是访客正在看的那一版。
        两者在复审期间不同——这正是「改稿不等于下线」的实现方式。
      properties:
        revNo:
          type: integer
          minimum: 1
        title:
          type: string
        demoType:
          type: string
        source:
          type: string
          enum: [upload, url_import, rollback]
        fileCount:
          type: integer
        totalBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        erased:
          type: boolean
        isCurrent:
          type: boolean
        isPublished:
          type: boolean

    RevisionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoRevision'

    RestoreResult:
      type: object
      additionalProperties: false
      required: [slug, restoredFromRevNo, revisionNo, moderationState]
      description: 回滚的回执。回滚不是「撤销」，它追加了一个新版本，所以回执里同时有新版本号与来源版本号。
      properties:
        slug:
          type: string
        restoredFromRevNo:
          type: integer
          description: 内容取自哪一版
        revisionNo:
          type: integer
          description: 回滚产生的新版本号
        moderationState:
          type: string
          enum: [pending, approved, rejected]

    DemoDetail:
      allOf:
        - $ref: '#/components/schemas/DemoSummary'
        - type: object
          additionalProperties: false
          required: [description, updatedAt, demoType, downloadable, canEdit, lifecycleActions]
          properties:
            description:
              type: string
              nullable: true
              description: 墓碑态为 null
            updatedAt:
              type: string
              format: date-time
            demoType:
              type: string
              description: |
                作品类型，取自 `demo_types` 主数据（`web` / `zip` / `link` / `image`）。
                墓碑态为空串——墓碑不承载内容，也就没有类型可言。
            canEdit:
              type: boolean
              description: |
                当前调用者能不能编辑这个作品（只有作者本人在非墓碑态下为 `true`）。

                作者视图与公开视图的差别不止这一列：

                - 作者看得到自己还没过审的稿件（公开视图对 `draft`/`pending`/`rejected` 一律 404）
                - 作者看到的 `title` / `description` / `demoType` 是**当前版本**的，
                  访客看到的是**对外版本**的——改稿期间两边内容不同是正常的
            downloadable:
              type: boolean
              description: |
                这个作品现在能不能下载。

                `false` 的原因是**作品本身不该有下载**：墓碑态、外链作品（`link` 只给外链
                地址，不给本站包）、或者渠道对外不可见（`hidden`）。

                这里**不包含**「文件在存储里不见了」——那是事故，不是作品的属性。
                检测它需要每次详情都去存储里 `Stat` 一遍（一次额外的 IO 往返），
                而「文件丢了」的正确表现是下载时明确 404，不是详情页悄悄少一个按钮。

                前端据此决定出不出「下载作品」，**不要自己按 `demoType` 猜**——
                猜出来的按钮会点出 404。
            lifecycleActions:
              $ref: '#/components/schemas/DemoLifecycleActions'

    DemoLifecycleActions:
      type: object
      additionalProperties: false
      required: [archive, unarchive, delete, restore]
      description: |
        当前调用者此刻能对这个作品做哪些生命周期动作。四个布尔全给，
        前端不需要再按 `lifecycleState` 自己推——推错的后果是「按钮点了 409」。

        判定放在服务端，因为它取决于三个变量的组合：是不是作者、有没有被删、
        是不是被平台移除。这三件事前端凑不齐（`deletedAt` 并不出现在响应里）。
      properties:
        archive:
          type: boolean
          description: 能下架（已发布、未删除、非平台移除）
        unarchive:
          type: boolean
          description: 能重新上架（已下架、未删除）
        delete:
          type: boolean
          description: 能删除（未删除、非平台移除）
        restore:
          type: boolean
          description: |
            能恢复（已删除、非平台移除）。

            这里**不**判定恢复窗口是否过期：那要查 GC 队列，而详情页每次请求都多一次
            队列查询不划算。窗口过期的正确表现是点「恢复」时收到 409
            `restore_window_closed`，页面上如实显示——比在详情页猜一个可能过期的数好。

    DemoLifecycleResult:
      type: object
      additionalProperties: false
      required: [slug, lifecycleState]
      properties:
        slug:
          type: string
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    DemoDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: 删除理由，进 `demos.delete_reason`，只给自己留个记录

    DemoDeleteResult:
      type: object
      additionalProperties: false
      required: [slug, lifecycleState, purgeAfter]
      properties:
        slug:
          type: string
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        purgeAfter:
          type: string
          format: date-time
          description: |
            最晚可恢复时刻。**在删除那一刻定型**（删除时刻 + 当时配置的
            `lifecycle.restore_window_days`），之后调整窗口参数不会改它——
            否则系统会承诺一件它在原定日期做不到的事。

    DemoList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
          description: 满足条件的总条数（不是当前页条数）

    SubmissionResult:
      type: object
      additionalProperties: false
      required: [slug, revisionNo, moderationState, lifecycleState]
      properties:
        slug:
          type: string
          maxLength: 128
          description: 生成的唯一标识，客户端用它跳详情页
        revisionNo:
          type: integer
          minimum: 1
        moderationState:
          type: string
          enum: [pending, approved, rejected]
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    LifecycleState:
      type: string
      description: |
        作品生命周期状态。与标准对象 §ST-2 的可见性档位对应：
        `draft` / `pending` / `rejected` 对外不可见；`published` 正常可见；
        `archived` / `removed` 可见但为墓碑态。
      enum: [draft, pending, published, rejected, archived, removed]

    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: 邮箱或用户名，不区分大小写

    PasswordResetCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        emailCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            邮箱验证码。只有在该标识符失败次数超阈值时才需要；
            平时传了也会被忽略。

        identifier:
          type: string
          description: 邮箱或用户名，不区分大小写
        password:
          type: string

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, username, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 只以 argon2id 哈希入库，接口从不回显
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
          description: 不区分大小写唯一（标准对象 §ID-2）
        displayName:
          type: string
          maxLength: 50
          description: 可为空串，展示时回退到 username

    RegisterAccepted:
      type: object
      additionalProperties: false
      required: [email, verificationSent]
      properties:
        email:
          type: string
          description: 回显注册用的邮箱，前端直接带到验证页
        verificationSent:
          type: boolean
          description: |
            验证信是否发出去了。`false` 表示账号建好了但 SMTP 没成功——
            前端应提示「去验证页点重新发送」，而不是当成注册失败。
            不要用它判断账号存不存在：账号一定存在（这个响应只在 201 出现）。

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^[0-9]{6}$'

    VerifyEmailResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    Me:
      type: object
      additionalProperties: false
      required: [sub, username, displayName, email, role, status, level, createdAt]
      properties:
        sub:
          type: string
          description: 对外不可变 ID（base32(128 bit)，26 字符），不暴露自增主键
        username:
          type: string
          maxLength: 20
        displayName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          description: 只有本人看得到自己的邮箱
        role:
          type: string
          description: 角色快照，权限判定不只看它
        status:
          $ref: '#/components/schemas/AccountStatus'
        level:
          type: integer
          minimum: 0
          description: 等级投影镜像，级数不封顶（EXP-001）
        createdAt:
          type: string
          format: date-time

    AccountStatus:
      type: string
      enum: [pending, active, suspended, banned, deleted]
      description: 账号状态取值域，见标准对象 §ST-1

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'

    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [slug, title, description, authorName, moderationState, submittedAt, previewPath]
      properties:
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        authorName:
          type: string
          nullable: true
          description: 作者显示名；作者已注销时（author_id 被 SET NULL）为 null
        moderationState:
          type: string
          enum: [pending]
        submittedAt:
          type: string
          format: date-time
        previewPath:
          type: string
          description: 作品入口的相对地址，审核员直接拼到本站域名后使用

    ReviewDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
          description: 给作者看的说明；驳回时应当写清哪里不合格

    ReviewResult:
      type: object
      additionalProperties: false
      required: [slug, moderationState]
      properties:
        slug:
          type: string
        moderationState:
          type: string
          enum: [approved, rejected]

    PublishRequest:
      type: object
      additionalProperties: false
      required: [channel, visibility]
      properties:
        channel:
          type: string
          minLength: 1
          maxLength: 32
          description: 必须是 channels 表里已登记且 status='active' 的码值
        visibility:
          type: string
          enum: [listed, unlisted, hidden]
        lang:
          type: string
          enum: [zh, en]
          default: zh

    PublishResult:
      type: object
      additionalProperties: false
      required: [slug, lifecycleState, channel, visibility]
      properties:
        slug:
          type: string
        lifecycleState:
          type: string
          enum: [published]
        channel:
          type: string
        visibility:
          type: string
          enum: [listed, unlisted, hidden]

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-demo_session
      description: |
        不透明随机串（不是 JWT）。`__Host-` 前缀由浏览器强制 `Secure` + `Path=/` +
        **不设 Domain**；设了 Domain 就等于把会话暴露给 `cdn.` 与 `*.sandbox.` 等
        所有子域（身份域 §11.1）。
