openapi: 3.0.3

info:
  title: DeepDemos API
  version: 0.1.0
  description: |
    本文件是**接口的唯一事实源**。改接口先改这里，再跑生成，再改实现；不要手改生成目录。

    当前范围：站点可用性、作品列表与详情、投稿与更新、审核队列与裁决、发布到渠道、
    生命周期（下架 / 重新上架 / 软删 / 恢复）、版本历史与回滚、浏览计数、模型目录、
    模型目录同步与导入（含批量）、分类目录与筛选、作品评分（一人一票，可改可撤）、
    作品榜与相关推荐、我的作品、渠道上架与撤下，
    以及身份（注册 / 邮箱验证 / 登录 / 登出 / 我是谁 / 发验证码 / 找回密码），
    共 44 个端点。实现全部已接入并有集成测试覆盖。这个数字由 `scripts/check-api-doc.mjs` 核对
    （它漂过两次：三个 → 18 → 24，都是 review 读出来的），改端点时不用记着手改。

    不在契约里的两个端点：`GET /preview/{slug}/*` 与 `GET /download/{slug}`。
    它们的响应体是 HTML / zip 字节而不是 JSON，「所有端点返回 JSON、错误有统一 ErrorBody」
    这条前提对它们不成立。判定逻辑在 `backend/internal/httpapi/preview.go` 与 `download.go`。

    这份描述会随端点增加而更新——它长期停在「三个端点」正是 `api/surface.json` 基线
    不自动成长的症状（见 `docs/已知松点.md` 第 18 条）。

    写成中文的部分是给人看的说明；`description` 会进入生成的注释，所以也写中文。

    **为什么是 3.0.3 而不是 3.1**：选 3.1 时没有验证工具链。实测 `oapi-codegen` v2.5.0
    至今不支持 3.1（上游 issue #373），3.1 的 `type: [string, 'null']` 写法会直接生成失败；
    若改用 3.0 的 `nullable` 关键字又会让文件既不是 3.1 也不是 3.0。
    两者取其一是干净的：降到 3.0.3。3.1 相对 3.0 的主要增益（webhooks、
    JSON Schema 2020-12 对齐）本项目当前一点没用到，降级不损失表达力。

servers:
  - url: /
    description: 同域反代（Nginx 静态 + Go API）

tags:
  - name: 系统
    description: 运行状态检查
  - name: 作品
    description: 作品列表与详情
  - name: 身份
    description: 会话与当前登录者

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [系统]
      summary: 站点可用性
      description: |
        返回站点是否可用。**不得携带任何配置值、账号信息或内部依赖细节**（SET-006）。
        核心资料暂不可访问时应当返回非 200，而不是 200 加一个字段说明——运行检查只看状态码。
      responses:
        '200':
          description: 站点可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthz'
        '503':
          description: 站点不可用（核心资料暂不可访问）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/classifications:
    get:
      operationId: listClassifications
      tags: [作品]
      summary: 分类目录
      description: |
        全部可用的分类项，按维度分组返回。**每个维度都带 `demoCount`**——
        它是「按这个分类筛选后会有多少条」，与列表端点的可见性判据同源，
        所以筛选器上显示的数目与点进去看到的条数不会打架。

        三个维度的分工：

        - `genre` 形态：这是什么（小游戏 / 模拟 / 视觉特效 / 工具……），可带父子
        - `technique` 技术：靠什么做的（3D 建模 / 仿真 / 动画 / 图形学 / 机器人）
        - `subject` 题材：对着什么做的（某个具体作品、某个物件、某段历史），开放集

        只返回 `status='active'` 的项。被合并掉的项不再出现，但它们的历史引用
        仍然有效——详情页读出来的是当年那个名字。
      responses:
        '200':
          description: 分类目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationCatalog'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demo-types:
    get:
      operationId: listDemoTypes
      tags: [作品]
      summary: 作品类型目录（含允许的上传形态）
      description: |
        投稿页要「选类型」，而每个类型收什么文件不是界面的自由，是平台的规矩。
        这个端点把规矩一次给全，界面就不用自己写死一份。

        `formats` 是允许的上传形态，取值集合由服务端定义（`single:html` /
        `zip:godot` / `url` ……）。**空数组的含义是「这个类型还不收文件」**，
        不是「任意都收」——把它当「任意」会让界面给出一个必然失败的选择。

        在此之前类型与形态毫无关系：选「压缩包作品」投一个 `.html` 也能通过，
        因为校验只看文件。现在投稿时服务端会检测真实格式并与类型比对。
      responses:
        '200':
          description: 作品类型目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoTypeList'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/models/{slug}:
    get:
      operationId: getModel
      tags: [作品]
      summary: 模型页
      description: |
        一个模型的完整视图：**档案**（`specs`）、**站内表现**（`site` + `providers` +
        `demos`）、**第三方基准**（`benchmarks`）。三块独立口径，不合并成一个总分——
        它们的置信度差得远。

        **站内表现一律按当前 revision**（模型域 §5.1 G18）：作品归属取
        `demos.current_revision_id` 对应的关联。作者改稿把模型从 A 换成 B，这里立刻跟着变，
        即使线上展示的仍是 A 那一版。这是选定口径，不是 bug。

        `site.scored=false` 表示**还没有人给它投过票**，此时 `site.score` 没有意义
        （契约里仍给 0，但界面不该显示「0 分」）。`site.priorWeight` 是贝叶斯收缩的
        `m`（各模型票数中位数，下限 1），摆出来是为了让读者能自己复核分数，不是让人调。

        `providers` 里 `providerId` 为空的行表示「来源未标注」——它不是某个服务方，
        而是我们不知道是谁，所以永远排在最后。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
          description: 模型标识（`models.slug`）
      responses:
        '200':
          description: 模型页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
        '404':
          description: 没有这个模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/models:
    get:
      operationId: listModels
      tags: [作品]
      summary: 模型目录（全部状态，可筛）
      description: |
        返回模型目录，按名字排序。**默认返回全部状态**，可以用 `?status=` 筛。

        **为什么需要这个端点**：投稿与编辑表单要让作者声明「这个作品用了哪些模型」，
        而模型是主数据（`models` 表），不能由前端写死一个列表——写死的那份迟早
        与库里不一致，而且新增一个模型要发一次前端版本。

        **为什么不再默认只出 `active`**：那样契约里的 `status` 字段永远等于同一个值，
        等于给了个常量。目录页要展示「候选 / 未核实 / 已退役（并指向合并归宿）」，
        这个筛选交给调用方做——表单那边自己传 `?status=active`。

        `source` 是**派生的**（有 `model_external_refs` 行就是 `models.dev`，否则
        `manual`），不是表上的列：`models` 表没有这一列，而「有没有被上游目录认领过」
        本来就是 refs 表的事实。多加一列等于给同一件事两个出处。

        本期没有分页：模型目录是**受控的少量行**（外部目录导入的一部分），
        不是用户内容。真到了几百行的规模再加分页，那时它会需要一个管理界面。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [candidate, active, unverified, deprecated]
          description: |
            只出这个状态的行。不传表示全部。

            `candidate` 是作者手动建、还没被核实的新行；`unverified` 是认领了上游
            条目但来源可疑的；`deprecated` 是已退役，`mergedIntoSlug` 指出它并到了谁。
      responses:
        '200':
          description: 模型清单（按名字排序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/recommendations:
    get:
      operationId: listRecommendations
      tags: [作品]
      summary: 为你推荐（登录后现算）
      description: |
        给当前登录用户推荐几件作品，**每次现算、不落画像表**。

        种子是这个人的浏览与评分：他用过的作品身上的分类、模型、作者，三者
        与候选作品的重合度决定得分（共用分类 +3 / 共用模型 +2 / 同作者 +1），
        权重与相关作品同一套——两处口径必须一致，否则「相关」与「推荐」
        会给出两套不同的相似度。

        **排除自己看过或打过分的**：推荐里出现刚看完的那件，读者会以为系统
        没在听。**排除自己的作品**：作者不需要系统介绍他自己的东西。

        得分 0 不返回，哪怕结果为空。**没有种子时返回空数组**（新用户冷启动），
        这不是错误：界面应当整块不渲染，而不是显示「暂无推荐」。

        未登录一律 401——匿名访客的 `viewer_key` 是 `HMAC(ip)`，拿它做个性化
        等于把同一个 NAT 后面的人当成一个人。
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
          description: 返回条数，越界回 400，不静默截断。
      responses:
        '200':
          description: 推荐列表（可能为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationList'
        '400':
          description: limit 越界
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 服务暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/rankings:
    get:
      operationId: listRankings
      tags: [作品]
      summary: 作品榜（六个口径）
      description: |
        按六个口径之一排出作品榜，可按作品创建时间的范围过滤。

        **六个口径**（SOC-013）：`avg` 平均分 / `god` 5 分票 / `ghost` 1 分票 /
        `net` 5 分减 1 分 / `count` 评分人数 / `heat` 综合热度。

        **零评分作品的去处不一样**（SOC-014）：前四个榜**排除**零评分作品——
        没人投过票的作品在这个榜上没有可比的数；`count` 与 `heat` **包含**它们，
        因为「还没人评分」本身就是评分人数榜的一个事实。所以同一批作品在
        `count` 与 `avg` 两个榜上的条数通常不同，这不是分页错位。

        **`range` 按作品创建时间过滤，不是按投票时间**（SOC-016）。一件 40 天前
        创建、今天才被投票的作品不会出现在「近 7 天」榜里——需求的原文就是按
        创建时间，所以「老作品新热度」进不了短周期榜是选择，不是缺陷。

        **只纳入当前已上架作品**（SOC-017）：下架、软删、审核未通过的一律不出现，
        判据与作品库同源（`demo_public_demos` 视图）。

        **并列按附录 D**，最后一级是「较晚登记优先」（`created_at` 倒序），
        所以同分作品的名次稳定、翻页不会跳来跳去。`rank` 是**连续名次**：
        同分也按这个稳定序编号，不做「并列共享名次、后面跳号」——跳号会让
        「第 21 名」这种链接指向一个不存在的页码。
      parameters:
        - name: board
          in: query
          required: false
          schema:
            type: string
            enum: [avg, god, ghost, net, count, heat]
          description: |
            榜的口径，默认 `avg`。

            `value` 的含意在六榜之间不同：`avg` 是平均分（0–5），`god` / `ghost` /
            `count` 是票数，`net` 是净票（可为负），`heat` 是综合热度分。
            界面要按 `board` 换单位文案，不能一律当成分数。
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [all, week, month]
          description: |
            时间范围，默认 `all`。`week` / `month` 是**近 7 / 30 天**（相对当前时间），
            按 `demos.created_at` 过滤。
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 一页多少名，默认 20，上限 100。超过上限直接 400，不静默截断。
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 从第几名之后开始（0 基），与作品库的分页口径一致。
      responses:
        '200':
          description: 榜单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingList'
        '400':
          description: 参数非法（未知 board / range、limit 越界）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos:
    get:
      operationId: listDemos
      tags: [作品]
      summary: 作品列表
      description: |
        分页返回已公开的作品。分页参数口径与治理域 §P5 一致：默认 50，上限 200。
        超过上限直接 400，不静默截断——静默截断会让调用方以为拿到了全部。
      parameters:
        - name: genre
          in: query
          description: |
            按形态筛选，可重复（`?genre=game&genre=puzzle`）。

            **语义：维度内取并集（OR）、维度间取交集（AND）**——这是
            `docs/标签域数据结构设计.md` §5.5 定的口径，不是这里发明的。
            所以「游戏或解谜」+「3D 建模」= 既是游戏或解谜、又用了 3D 建模的作品。

            取值是 `classifications.slug`（见 `GET /api/v1/classifications`）。
            **未收录的 slug 不报错、也不命中**：筛选是查询而不是写入，一个拼错的
            条件应该得到空结果，而不是 400——否则「改 URL 试试看」会变成一堆红字。
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          style: form
          explode: true
        - name: technique
          in: query
          description: 按技术筛选，语义同上（维度内 OR、维度间 AND）。
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          style: form
          explode: true
        - name: subject
          in: query
          description: |
            按题材筛选，语义同上。

            `subject` 是开放集，长尾很长（92 条里 32 条只被一件作品用过），
            所以它不一定出现在界面的筛选器上——接口支持它是为了让
            「同一题材的作品」这类链接可以直达，而不是鼓励摆一列长尾。
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          style: form
          explode: true
        - name: model
          in: query
          description: |
            按模型筛选（`models.slug`），语义同上。

            模型挂在**版本**上，不挂在作品上：这里比对的是作品当前版本声明的模型。
            作者改稿换模型之后，按旧模型就搜不到它了——这是版本分离的直接后果，
            与「访客看已发布版本、作者看当前版本」是同一套规则的另一面。
          schema:
            type: array
            items:
              type: string
            maxItems: 50
          style: form
          explode: true
        - name: q
          in: query
          description: |
            关键词，匹配标题或简介（子串匹配，不区分大小写）。

            空串与全空格等同没传；超过 100 个字返回 400，不静默截断。
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          description: |
            排序口径（SCH-006）：

            - `latest` 按作品登记时间新→旧
            - `hot` 按综合热度（SOC-015：浏览数 + 2 × 下载数 + 有效评分人数）高→低
            - `random` 按 `seed` 派生一个稳定随机序（SCH-007）

            并列时按附录 D：热度并列取较晚登记的在前，最后按 `id` 倒序，保证稳定。
            `hot` 与 `random` 都只在公开可见的作品里排（与列表口径同一份）。
          schema:
            type: string
            enum: [latest, hot, random]
            default: latest
        - name: seed
          in: query
          description: |
            随机序的种子，只在 `sort=random` 时有意义。

            **翻页必须带同一个 seed**：换 seed 等于重新抽样，同一轮的下一页就会
            与前几页重叠或漏项（SCH-007 要求不重复）。缺省按 0 处理，因此
            「不传 seed」也是稳定序——但客户端应当自己生成并写进 URL，
            否则每轮的「随机」都长一样。
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoList'
        '400':
          description: 参数非法（含 pageSize 超上限）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: submitDemo
      tags: [作品]
      summary: 投稿（multipart，连文件一起上传）
      description: |
        需要登录。一次请求同时提交元数据与作品文件，由服务端校验、解压、落库、上传。

        **为什么是后端中转而不是预签名直传**：直传有三个失败点（签名过期、传一半断、
        确认丢失），每个都要额外清理孤儿对象；本期没有带宽压力，中转把失败点收敛成一个。
        等带宽成为瓶颈时再换，契约形状不用改——客户端仍然是「一次提交」。

        **可选的 `Idempotency-Key` 请求头**：给了就保证「同一个作者的同一个 key
        只会落一行作品」。脚本传一个大包传到一半断线、自己重传一次时，
        第二次拿到的是**第一次那条**（`200`），不会变成两条一模一样的作品。

        没给就完全不幂等——这与「给了才发现不支持」有本质区别：后者会让调用方
        以为自己有保护。重放返回的审核态与生命周期是**当下的值**，
        不是当初回执的快照（那条作品可能已经通过或被驳回）。

        `package` 支持两种形态：
        - 一个 zip 包，**包根必须有 `index.html`**
        - 单个 `.html` / `.svg` 文件

        服务端闸门（数值见 `docs/运行手册-可变常量.md` §3）：包体积、解压后体积、
        成员数、压缩比四道，任一不过即 422。
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            调用方自己生成的幂等键（建议 UUID），最长 128 字符，超出回 400。

            命中已有键时**不新建**、不重新上传、不占用待审配额，直接返回
            `200` 与当初那条作品；第一次提交返回 `201`。两者回执形状相同，
            客户端用状态码区分「我创建了它」与「它早就存在」。

            同一作者用同一个键提交两次不同内容，返回的是**第一次**的结果
            （后一次的内容被丢弃）——幂等键的语义是「这件事做过了」，不是
            「这两次的内容一样」。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              # package 不再是必填：外链作品只交 externalUrl。
              # 「两者恰好给一个」这条 OpenAPI 表达不了，由服务端判（都给或都不给都是 400）。
              required: [title, demoType]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                demoType:
                  type: string
                  maxLength: 32
                  description: |
                    作品类型。取值见 `demo_types` 表——它是主数据，**加一种类型是加一行
                    数据，不是改契约**，所以这里不定 enum。
                package:
                  type: string
                  format: binary
                  description: |
                    作品文件（zip 或单个 html/svg/glb/png/jpg/webp）。

                    与 `externalUrl` **互斥**：两者都给或都不给都是 400。
                externalUrl:
                  type: string
                  maxLength: 2000
                  description: |
                    外链作品的地址（只收 `http://` 与 `https://`）。

                    给了它就不要上传 `package`。收录之后预览会 **302** 到这个地址：
                    外部站点能不能被 iframe 嵌不归我们决定，硬嵌的结果是白屏。
                modelSlugs:
                  type: array
                  description: |
                    这一版用到的模型。每一项是一个**模型指称**：`slug`、展示名或别名
                    都可以（大小写不敏感），由服务端统一解析。从 `GET /api/v1/models`
                    选一个是最常见的情形，但不是唯一写法——作者在表单里手打的名字
                    同样成立。

                    字段名带 slugs 而不是 ids：调用方手里拿到的是 slug，数字 id 是实现
                    细节。叫 modelIds 却收 slug，等于让每个调用方都去翻一遍文档确认
                    自己没传错。

                    **解析不到的名字不会报错**：服务端建一条 `status=candidate` 的候选项
                    （`models` 表一行 + 一个同名别名）并挂到这一版上，之后管理员归并。
                    理由：灰测模型等不起人工审核，而 candidate 与 active 的区别只是
                    「有没有被确认过」。代价是作者可以造出脏名字，由归并消化
                    （`docs/已知松点.md` 第 50 条）。

                    不传或空数组都合法——作品可以不声明模型。超长（>128 字）的名字
                    一律 400。

                    没有条数上限：多少由作品的事实决定；重复的 slug 会被去重。
                  items:
                    type: string
                    maxLength: 128

                classificationSlugs:
                  type: array
                  description: |
                    这件作品的内容分类，取值为 `classifications.slug`（来自
                    `GET /api/v1/classifications`）。

                    **与 `modelSlugs` 的语义不同**：分类挂在作品上、模型挂在版本上。
                    分类写一次就跟着作品走，之后的版本共享它；模型声明是一版一份。

                    投稿时不传即没有分类。更新时**不传表示「不改」**，不是「清空」——
                    multipart 里「没传」与「传了空」在浏览器侧无法区分，按整体替换
                    处理会让任何只改标题的请求顺手清掉作者打的分类，而作者从页面上
                    看不出这件事发生过。代价是「清空分类」暂无路径
                    （`docs/已知松点.md` 第 48 条）。

                    传了不存在的 slug 或维度内有歧义的 slug 一律 400，不静默丢弃。
                  items:
                    type: string
                    maxLength: 128
                  maxItems: 20
      responses:
        '201':
          description: 已接收，进入待审核（对外不可见）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '200':
          description: |
            命中了 `Idempotency-Key`：这条作品早就提交过，**没有新建**。
            返回的 slug / 版本号 / 审核态都是那条作品当下的值。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: 参数非法（缺字段、标题过长、类型未知）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 包体积超过上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 文件类型不支持（既不是 zip 也不是 html/svg）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 包内容不合格（缺 index.html、压缩炸弹、成员过多等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            待审作品太多（`UPLOAD_MAX_PENDING`），等审核消化一些再来。

            带 `Retry-After`：它是**建议的复查间隔，不是承诺**——真正的解锁时刻
            是有人审完你压着的那几条，服务端不知道那会是什么时候。
            给一个数是为了让调用方能退避重试，而不是立刻重打或直接放弃。
          headers:
            Retry-After:
              description: 建议等待的秒数（当前实现为 3600）
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 存储或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/rating:
    put:
      operationId: putDemoRating
      tags: [作品]
      summary: 给作品打分（1–5，一人一票，可改）
      description: |
        同一人对同一作品只有一票：再打一次是改分，不是追加。去重键是
        `rater_key`（登录用户 `user:<id>`，匿名 `anon:<HMAC(ip)>`），
        与浏览计数同一套口径——两处如果各算各的，同一个人在两处会是两个人。

        **匿名也能打分**：民间成果展的作品大多是给外人看的，要求先注册才能
        说「这个不错」，等于把最轻的一次表态推到最重的门槛后面。
        代价是同一出口 IP 的多人共用一票（已知松点第 39 条同一口径）。

        **作者可以给自己打分**（`rate-self B`）。不拦的理由：作者给自��作品
        打 5 分这件事，在页面上是看得见的（作者名与评分都在），而且它的
        影响面只有自己的作品；为它加一条「不能给自己投票」的规则，会连带
        让「作者参与自己的作品合集」这类正当操作也被拦住。

        作品不存在或不可见 → 404（与详情一致）；分数越界 → 400。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRatingInput'
      responses:
        '200':
          description: 打分成功，返回该作品当前的评分汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRating'
        '400':
          description: 分数越界或请求体不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在或不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteDemoRating
      tags: [作品]
      summary: 撤销自己的评分
      description: |
        撤销之后该作品的平均分按剩余票重新算。没打过分的调用是幂等的 200，
        不报错——「我不想给它打分了」这个意图本来就成立。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 撤销后的评分汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoRating'
        '404':
          description: 作品不存在或不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/view:
    post:
      operationId: postDemoView
      tags: [作品]
      summary: 记一次浏览
      description: |
        由详情页在渲染成功之后调用一次。**不是**在 `GET /api/v1/demos/{slug}` 里顺带计数：
        GET 有副作用的话，爬虫、预取、文档里试一下、curl 验证一下，全都会变成一次浏览。

        同一个人（登录按账号、匿名按 IP 哈希）对同一作品，同一个自然日只算一次。
        去重表是 `demo_views`，主键 `(demo_id, viewer_key, viewed_on)`。

        **一律返回 204**：作品不存在、已下架、今天已经看过、身份未接线——都不报错。
        这个端点由页面自动调用，404 只会让「作品刚被删」这种正常情况在控制台里刷一片红；
        真正的可见性判定在详情端点上。

        不返回计数：那样它会变成「写 + 读」的混合体，前端拿它当准实时显示用，
        缓存与去重就都失效了。计数由详情端点给。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '204':
          description: 已受理（不表示这次真的计入了，去重与可见性由服务端判断）

  /api/v1/demos/{slug}:
    get:
      operationId: getDemo
      tags: [作品]
      summary: 作品详情
      description: |
        `slug` 的格式与长度来自 `db/schema/30-demo.sql` 的 `ck_demos_slug_len`（1–128）。

        **404 的语义要和墓碑口径一致**：曾经公开过、后来被作者归档或被管理员移除的作品，
        仍然返回 200 的墓碑态（标题等字段可空、带 `lifecycleState`），不返回 404；
        只有「从未公开过」或「已擦除」才返回 404。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 详情；曾公开过但已归档/移除的返回墓碑态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDetail'
        '404':
          description: 不存在，或从未公开过，或已擦除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: updateDemo
      tags: [作品]
      summary: 更新作品（追加新版本，等复审）
      description: |
        需要登录，且只有作者本人能调用（不是作者一律 404——403 会说「这个 slug 存在」）。

        **更新不是就地改，是追加一个版本**：`demo_revisions` 有不可变触发器，
        审核过的内容必须能原样追溯。新版本的 `revNo` 是当前最大版本号 + 1。

        **旧版本继续对外服务**：新版本落在 `demos.current_revision_id` 并把审核态打回
        `pending`，而对外内容由 `published_revision_id` 决定——要等管理员通过才切换。
        所以作者改稿期间，作品在作品库、详情页、预览、下载里都还是上一版。
        这是「审核」与「下线」的区别：改稿不该让线上作品消失。

        `package` 可以不传，表示**只改标题与简介**：新版本的清单是上一版的整表复制，
        每个文件指向同一份 blob，磁盘零新增。

        传了 `package` 才能改 `demoType`——类型是内容决定的；只改文字却把 web 改成 zip，
        会让下载与预览指着不同的事实（400）。被平台移除（`removed`）的作品不允许
        作者自行改回（409）。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                demoType:
                  type: string
                  maxLength: 32
                  description: |
                    作品类型。**只有同时上传 `package` 时才能改**。
                package:
                  type: string
                  format: binary
                  description: 新的作品文件；不传表示只改文字
                externalUrl:
                  type: string
                  maxLength: 2000
                  description: |
                    外链作品的新地址。**不传表示沿用上一版**——multipart 里
                    「没传」与「传空」在浏览器侧无法区分，沿用是唯一安全的方向。
                modelSlugs:
                  type: array
                  description: |
                    这一版声明的模型，语义是**整体替换**。每一项是模型指称
                    （slug / 展示名 / 别名），解析不到时自动建候选项，
                    规则与 `POST /api/v1/demos` 完全相同。

                    不传等价于空数组，也就是「这一版不声明任何模型」——不做
                    「没传就沿用上一版」：multipart 里「没传」与「传空」在浏览器侧
                    无法区分（空选择不产生字段），沿用会让作者永远删不掉一个声明。
                  items:
                    type: string
                    maxLength: 128

                classificationSlugs:
                  type: array
                  description: |
                    这件作品的内容分类（`classifications.slug`），语义是**整体替换**，
                    但**不传表示「不改」而不是「清空」**——理由见 `POST /api/v1/demos`
                    同名参数的说明与 `docs/已知松点.md` 第 48 条。
                  items:
                    type: string
                    maxLength: 128
                  maxItems: 20
      responses:
        '200':
          description: 新版本已追加，进入待审核（对外仍是上一版）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: 参数非法（缺标题、只改类型没传包、作品没有版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或不是当前调用者的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 作品已被平台移除，作者不能再改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 包体积超过上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 文件类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 包内容不合格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 存储或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteDemo
      tags: [作品]
      summary: 删除作品（软删，可恢复）
      description: |
        写 `deleted_at` 并把作品目录入 GC 队列。**不改可见性层**：下架时删的，
        恢复后还是下架。

        删除后作品**对外不存在**（详情也是 404，不给墓碑——墓碑等于承认这里有过东西），
        只有作者本人能看到「已删除 · 可恢复」。

        恢复窗口在删除这一刻定型：响应里的 `purgeAfter` 就是最晚可恢复时刻，
        之后恢复一律 409（`restore_window_closed`）。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoDeleteRequest'
      responses:
        '200':
          description: 已删除，带最晚可恢复时刻
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDeleteResult'
        '400':
          description: 请求体不是合法 JSON，或理由过长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或者不是你的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 已经删过了 / 已被平台移除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/archive:
    post:
      operationId: archiveDemo
      tags: [作品]
      summary: 下架作品（作者本人）
      description: |
        `published → archived`。下架后：作品库不再出现、详情返回墓碑页（200，只有标题与
        「作者已下架」）、预览与下载 404。**渠道行不动**——下架不是删渠道，重新上架后
        渠道仍在原来的可见性上。

        这是作者自己的动作，见不到别人的作品（非作者一律 404，不返回 403：403 会承认
        这个 slug 存在过）。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLifecycleResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或者不是你的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 当前状态不允许下架（不是已发布、已被平台移除）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/unarchive:
    post:
      operationId: unarchiveDemo
      tags: [作品]
      summary: 重新上架（作者本人）
      description: |
        `archived → published`。不发通知、不改渠道、不动对外版本——上架只改变可见性。

        「被平台移除」（`removed`）的作品不能自己上架，那是治理域的处置。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已重新上架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLifecycleResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或者不是你的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 当前状态不允许（不是已下架、已被平台移除）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/restore:
    post:
      operationId: restoreDemo
      tags: [作品]
      summary: 恢复已删除的作品（作者本人）
      description: |
        清空 `deleted_at`，作品回到删除前的档位（下架时删的，恢复后还是下架）。
        不返回 403：**恢复窗口过期**与**文件已被回收**都是 409，但错误码不同——
        前者是「你来晚了」，后者是「系统提前清掉了」。

        路径与 `POST /api/v1/demos/{slug}/revisions/{revNo}/restore` 分开：那个恢复的是
        **内容版本**，这个恢复的是**被删掉的作品**。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLifecycleResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在、不是你的、或已被擦除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 没被删过 / 恢复窗口已过（`restore_window_closed`）/ 文件已被回收（`derivative_purged`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/related:
    get:
      operationId: listRelatedDemos
      tags: [作品]
      summary: 相关作品
      description: |
        按**内容信号**找相关作品：共用分类、共用模型、同一作者。不看流量——
        共同浏览要先有足够的浏览数据，而分类与模型是作者投稿时就写下来的。

        权重：共用一项分类 +3、共用一项模型 +2、同一作者 +1。分类最重是因为它是
        「这是什么」的直接描述；模型次之（同模型的作品往往同题材）；作者最轻——
        「同一个人做的」相关性弱于「同一类作品」，但它能把没有分类的早期作品接上。

        **只返回得分大于 0 的作品**，没有「随便凑几件」的兜底：相关作品区空着，
        比塞四件不相干的作品更诚实。前端的空态就是不渲染这个区块。

        **只含已上架作品**，且不含自己（`demo_public_demos` 视图，与作品库同源）。
        源作品本身也必须公开可见，否则 404——与详情同一口径，不给「探测 slug 是否存在」的窗口。
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
          description: 作品标识
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
          description: 返回几件，默认 6，上限 12。多给几件没有意义——详情页放不下。
      responses:
        '200':
          description: 相关作品（可能为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedList'
        '400':
          description: limit 越界
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在或不可公开访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/timeline:
    get:
      operationId: listDemoTimeline
      tags: [作品]
      summary: 作品动态（只有作者能看）
      description: |
        这张表是**写给人看的经过**（Demo 域 §3.11），不承担审计职责——审计在
        `audit_log`。十种动作各留一行：投稿、通过、驳回、发布、编辑、回滚、
        下架、恢复（`create` / `slug_change` / `merge` 是预留值，暂无写入点）。

        **只给作者本人**：审核员看得到待审队列，但看不到别人作品的改动史；
        对非作者一律 404 而不是 403——403 会承认「这个 slug 存在且你有权限问题」，
        而能被作者以外的人看到的详情本来就只有对外那一版。

        墓碑页不显示动态：作品已经被下架或删除，它的经历没有必要再展示。
        作者在恢复窗口内仍能读到（那是他自己的记录）。

        最多返回最近 100 条，按时间倒序。没有分页：单件作品的动作数量级是几十，
        加游标只会多一个没人用的参数。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 作品动态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoTimeline'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在、已被擦除，或你不是作者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/revisions:
    get:
      operationId: listDemoRevisions
      tags: [作品]
      summary: 版本历史
      description: |
        需要登录。作者看自己的，审核员看任意作品的（`demo.review`）；其他人一律 404。

        **为什么不做成公开端点**：列表里有「哪一版还没过审」这类只有作者与审核员该知道的信息。
        访客看到的内容永远由 `published_revision_id` 决定，不需要版本列表。

        新的在前。`isCurrent` / `isPublished` 由两个指针直接比出来，不是在应用层推的。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或调用者既不是作者也没有审核权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}/revisions/{revNo}/restore:
    post:
      operationId: restoreDemoRevision
      tags: [作品]
      summary: 回滚到某一版
      description: |
        需要登录且是作者本人（不是作者一律 404）。

        **回滚是「追加」不是「撤销」**：新版本 `source=rollback`、清单整表复制目标版本
        （同一批 blob，零字节写入），版本号是当前最大值 + 1。历史一行不删——
        所以它失败安全：新版本没建出来的话，原来的对外版本一个字节都没动。

        回滚产生的新版本同样要过审：`current_revision_id` 指过去、审核态打回 `pending`，
        对外内容仍是 `published_revision_id` 那一版。**回滚不会让作品重新上线**，
        也不会让线上内容立刻变回旧版。

        拒绝的情况：作品不存在/不是作者/已删已擦（404）、被平台移除（409）、
        目标版本被擦除或删除（404）、目标版本就是当前版本（400）。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
        - name: revNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 新版本已追加，进入待审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '400':
          description: 版本号非法，或目标版本就是当前版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品或版本不存在，或不是当前调用者的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 作品已被平台移除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      tags: [身份]
      summary: 验证邮箱
      description: |
        消费验证码，把账号从 `pending` 推到 `active`，并给主邮箱盖上 `verified_at`。

        **成功后不自动登录**：这一步证明的是邮箱归属，不是身份。用户拿着刚验证过的
        邮箱再登录一次，才拿到会话——两个动作各自只做一件事。

        已经验证过的账号再提交一次直接返回 204（幂等，不消费码）：用户可能刷新页面
        重提交，回一句「验证码不对」只会让他以为码坏了。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: 验证通过（或本来就已通过）
        '400':
          description: 邮箱格式不对或没填验证码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 验证码不对或已过期（`code` 为 `unauthorized`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 尝试太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email/resend:
    post:
      operationId: postAuthVerifyEmailResend
      tags: [身份]
      summary: 重发验证邮件
      description: |
        给还没验证的账号再发一封。与发登录验证码共用同一套 IP 配额
        （每个 IP 每小时 20 封）——换个邮箱就是新额度的话，1000 个邮箱等于没有上限。

        **一律 204**：账号不存在、已注销、或邮箱本来就验证过，都走一遍生成与限流，
        只是不投递。响应形状与账号是否存在无关，所以这个端点探不出谁注册过。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
      responses:
        '204':
          description: 已受理（无论账号是否存在、是否真的投递）
        '400':
          description: 邮箱格式不对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags: [身份]
      summary: 注册
      description: |
        建账号并发一封验证邮件。**注册完不是登录态**：账号落在 `pending`，要先去
        `POST /api/v1/auth/verify-email` 证明邮箱是自己的，之后才能登录。

        为什么这么设计：没有这一步时「邮箱」只是用户随手敲的字符串，抢注别人的邮箱
        会让真正的主人在注册时撞 409，更麻烦的是找回密码——重置码寄往一个不属于
        注册者的地址，账号直接变砖。

        **邮箱与用户名都不区分大小写判重**（数据库上是 `lower(...)` 唯一索引），
        所以 `Alice` 与 `alice` 会撞 409，而不是建出两个账号。

        密码只以 argon2id 哈希入库，接口从不回显。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: |
            账号已建，验证邮件已发出。**不下发会话**——见上面的说明。

            `verificationSent` 为 `false` 时账号也是真的建好了，只是信没发出去
            （SMTP 抖动）。前端应提示用户去验证页点「重新发送」，而不是让他重填表单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAccepted'
        '400':
          description: 输入不合法（邮箱格式、密码长度、用户名规则）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 邮箱或用户名已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [身份]
      summary: 登录
      description: |
        `identifier` 可以是邮箱或用户名，都不区分大小写。

        **失败一律 401，不区分「没这个账号」与「密码错」**——区分了就等于提供一个
        免费的账号枚举接口。标识符不存在时也会跑一次同等代价的哈希校验，避免用
        响应时间把注册邮箱探出来。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，`Set-Cookie` 下发新会话
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: 账号或密码为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            账号或密码不对（不区分「没这个账号」与「密码错」）。

            当这个标识符在 10 分钟内失败达到 5 次时，服务端会要求邮箱验证码：
            此时即使密码正确也返回 401，`code` 为 `verification_required`。
            该判定**只看标识符的失败次数，不看账号是否存在**——所以它不能用来
            判断某个邮箱有没有注册过。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 尝试太频繁（身份域 §11.3 的三层限流）
          headers:
            Retry-After:
              schema: { type: integer }
              description: 建议等待的秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/email-code:
    post:
      operationId: postAuthEmailCode
      tags: [身份]
      summary: 申请登录验证码
      description: |
        `identifier` 与登录时填的一致（邮箱或用户名，不区分大小写）。

        **无论该标识符有没有对应账号，都返回 204**——账号不存在时不发信，但响应形状
        完全相同，否则这里就成了免费的账号枚举接口。

        发送频率限制在 1 次/分钟、5 次/小时；超限返回 429，这个也只看标识符，
        与账号是否存在无关。

        验证码投递到该账号的**主邮箱**，6 位数字，5 分钟内有效，一次性。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 已受理（不表示账号存在，也不表示信件一定送达）
        '400':
          description: 标识符为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库或邮件通道不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset/code:
    post:
      operationId: postAuthPasswordResetCode
      tags: [身份]
      summary: 申请找回密码验证码
      description: |
        只认**邮箱**，不认用户名——用户名是公开的，用它发起重置等于给攻击者
        一个「知道昵称就能骚扰到人」的入口。

        **无论该邮箱有没有注册，都返回 204**：不存在的邮箱同样会走一遍生成与
        频率限制，只是不投递。响应形状与账号是否存在无关。

        验证码发到主邮箱，6 位数字，5 分钟有效，一次性。与登录验证码**不能混用**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCodeRequest'
      responses:
        '204':
          description: 已受理（不表示邮箱注册过，也不表示信件一定送达）
        '400':
          description: 邮箱格式不对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库或邮件通道不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [身份]
      summary: 用验证码重设密码
      description: |
        验证码、改密码、吊销旧会话在**同一个事务**里完成。

        成功后该账号在本次重置之前签发的**所有会话立即失效**——这是「密码可能
        已经泄露」场景下的关键一步，只改哈希不踢会话等于没改。

        验证码错误、过期、超次数、邮箱不存在，一律 401，不区分原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已重置，旧会话全部失效
        '400':
          description: 邮箱格式不对、新密码长度不合格或验证码为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 验证码不对或已失效（不区分具体原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [身份]
      summary: 登出
      description: |
        吊销服务端会话并清掉 cookie。**幂等**：没带 cookie、会话已失效、ID 是伪造的，
        一律返回 204——登出失败对用户没有可执行的动作，而「这个会话不存在」
        又是一个可以拿来做探测的信号。
      responses:
        '204':
          description: 已登出（无论之前是否有有效会话）

  /api/v1/me:
    get:
      operationId: getMe
      tags: [身份]
      summary: 当前登录者
      description: |
        会话是**服务端**的：cookie 只装不透明串，服务端每次查 `web_sessions`，
        所以登出能让 cookie 立刻失效。「没带 cookie / 不存在 / 过期 / 已吊销」
        **故意都 401 且不区分**——区分了等于送一个免费的会话探测器。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/me/demos:
    get:
      operationId: listMyDemos
      tags: [作品]
      summary: 我的作品
      description: |
        当前登录用户自己的全部作品，按最近改动排序。

        与 `GET /api/v1/demos` 的差别只有**可见性口径**：公开列表只含已上架作品，
        这里返回作者视角的全部——草稿、待审、已驳回、已发布、已归档、已移除（软删）。
        作者必须能看见「我投的那份稿子去哪了」，这是投稿后不失联的前提。

        **擦除（erased）的作品不在其中**：擦除对外一律不存在，对作者也不留入口。

        `moderationState` 给作者真实值（与 `GET /api/v1/demos/{slug}` 的作者视图一致），
        不与 `lifecycleState` 合并：审核态说的是内容过没过，生命周期说的是对外哪种档位。

        `deletedAt` 非空表示 **作者自己删掉的**（软删）——它与 `lifecycleState` 正交，
        所以不能靠生命周期列判断「能不能恢复」。`purgeAfter` 是那一行内容被真正清掉的
        时刻，取自 `gc_queue`：恢复窗口在删除那一刻定型，这里只读它，不按当前配置现算。
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页条数，默认 50，上限 200（与 `listDemos` 同口径）；超过上限返回 400，不静默截断
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: lifecycle
          in: query
          description: 只看某个生命周期的作品（`draft` / `published` / `archived` / `removed`）。不传 = 全部
          schema:
            $ref: '#/components/schemas/LifecycleState'
        - name: moderation
          in: query
          description: 只看某个审核态的作品（`pending` / `approved` / `rejected`）。不传 = 全部。与 `lifecycle` 是**正交**的两个维度，可以一起用
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: deleted
          in: query
          description: |
            `true` = 只看软删的，`false` = 只看没删的，不传 = 全部。
            单独一维的原因：软删与生命周期正交（软删不改 `lifecycle_state`），
            所以「已删除」无法用一个生命周期取值表达。
          schema:
            type: boolean
            default: 50
      responses:
        '200':
          description: 我的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDemoList'
        '400':
          description: 分页参数越界
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/demos/{slug}/channels:
    get:
      operationId: listDemoChannels
      tags: [治理]
      summary: 看这个作品挂在哪些渠道上
      description: |
        管理端专用：返回作品在 `demo_channels` 里的全部渠道行（渠道 / 可见性 / 语言）。

        为什么单独一个端点而不是塞进详情：详情是公开读的出口，它的字段面讲的是
        「读者看到的这一件作品」，渠道是运营视角。混在一起要么让公开字段变胖，
        要么要按角色裁剪同一份 schema——两种都比多一个端点难维护。

        `404` 与「作品不存在」同一个回答（不泄露存在性）；`erased` 的作品也算不存在。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 这个作品的渠道行（没有渠道时是空数组，不是 404）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoChannelList'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 没有 demo.publish 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在或已擦除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: addDemoChannel
      tags: [治理]
      summary: 上架到一个渠道
      description: |
        给**已经对外**的作品追加一个渠道，或改某个渠道的可见性。

        与 `publishDemo` 的分工：那个做的是状态跃迁（`draft`/`archived` → `published`），
        只在第一次对外时成立；这个只做「再挂一处」。松点 26 记的就是以前做不到的情况：
        作品一旦变成 `published`，第二个渠道永远发不出去。

        要求：
        - 作品必须已有对外版本（`published_revision_id` 非空），否则 409——先从 `publishDemo` 发布；
        - 内容必须 `approved`，否则 409；
        - 渠道必须在 `channels` 里且 `status='active'`，否则 400；
        - `astra` 只收 `lang='en'`，与 `publishDemo` 同一张表判定。

        同渠道重复调用不会新增行，而是改可见性（返回 200 且 `created=false`）；
        新建渠道返回 201 且 `created=true`。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoChannelRequest'
      responses:
        '201':
          description: 新建了渠道行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoChannelResult'
        '200':
          description: 已有该渠道，可见性 / 语言被更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoChannelResult'
        '400':
          description: 渠道为空 / 可见性不在枚举内 / lang 不在枚举内 / 渠道未登记或已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 没有发布权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在（含软删、擦除）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 作品还没对外过 / 内容没通过审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/demos/{slug}/channels/{channel}:
    delete:
      operationId: removeDemoChannel
      tags: [治理]
      summary: 从一个渠道撤下
      description: |
        删掉这个作品在该渠道的行。**作品可以仍有别的渠道**——那正是多渠道的意义。

        最后一个渠道不能这样撤：仍是 `published` 却没有渠道行，会得到
        「状态说对外、列表里查不到」的作品。想彻底撤下请用下架（`archiveDemo`），
        那条路径有墓碑与恢复。所以这种情况返回 409。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: channel
          in: path
          required: true
          schema: { type: string, maxLength: 32 }
      responses:
        '204':
          description: 已撤下
        '400':
          description: 渠道为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 没有发布权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在，或这个作品没有这个渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 这是最后一个渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/models/sync:
    post:
      operationId: syncModelCatalog
      tags: [治理]
      summary: 立即同步上游目录镜像
      description: |
        拉 `models.dev` 整包（约 6 MB）重写本地镜像 `model_catalog_items`，并写一行
        `model_source_sync` 记账。整包地址与定时开关见模型域 §6.3。

        **整表重写**而不是逐条 upsert：镜像只回答「上游现在有什么」，混两个时间点之后
        就分不清「上游改了」与「这条还没更新」。行 id 会整批变，但没有任何地方引用它
        （认领关系存的是 `(source, provider_id, external_id)` 三元组）。

        三件失败保护：

        - payload 指纹与上次相同 → 不重写，回 200 `skipped=true`；
        - 解析失败 / 上游不可达 → 保留旧镜像，`model_source_sync.status='failed'`
          并写 `error`；
        - 另一个同步正在进行（多实例或连点）→ 409，不排队。

        需要 `model.import` 权限。定时同步是另一条路（设置项
        `modelsdev.sync_enabled` / `modelsdev.sync_interval_hours`），两者共用同一把
        advisory lock。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 同步完成（`skipped=true` 表示 payload 未变，镜像没重写）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSyncResult'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 model.import 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 另一个同步正在进行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 上游不可达或返回了无法解析的内容（本地镜像保持原样）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      operationId: getModelSyncStatus
      tags: [治理]
      summary: 读目录同步状态
      description: |
        读 `model_source_sync` 里这一来源的记账。**从没同步过时不是 404**：那是
        「从未同步」这个正常状态，返回 `status = never` 且时间为 null——管理页要能
        因此显示「点上面的同步」而不是一条红色错误。

        `status` 的四个取值（**故意不是 enum**：`ModelImportField.source` 与
        `Model.source` 的取值几乎重叠，写 enum 会让 oapi-codegen 给全仓枚举常量
        加类型前缀，那是为一个描述性字段付的全局代价）：

        - `ok`：上次成功，且没到下一个间隔
        - `stale`：上次成功，但已过间隔（定时器还没跑到 / 被关掉了）
        - `failed`：上次失败，`error` 里有原因；`lastSuccessAt` 仍是上一次成功的时间
        - `never`：一行都没有

        需要 `model.import` 权限。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 同步状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSyncStatus'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 没有导入权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/models/catalog:
    get:
      operationId: listModelCatalog
      tags: [治理]
      summary: 上游目录镜像（导入页的搜索）
      description: |
        查的是**本地镜像** `model_catalog_items`，不是实时问 models.dev：上游只提供整包
        JSON（约 10MB），没有搜索接口；上游不可用时本站照常工作（模型域 §4.6.1）。

        每行带 `imported`：这个上游条目是否已被某个本地模型认领（`model_external_refs`
        有行）。导入页据此显示「已导入 / 可导入」。

        默认过滤掉上游 `status = 'deprecated'` 的条目（旧站实测 904 条）。这与我们的
        `models.status = 'deprecated'`（合并退役）是**两套语义**：上游弃用说的是
        「厂商不再维护」，我们弃用说的是「这条已经并到别人身上」。要看它们得显式传
        `includeDeprecated=true`。

        需要 `model.import` 权限。
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: |
            按名称 / 上游 id / canonical / 厂商名子串匹配；不传表示不过滤。
            `%` / `_` / `\` 按字面匹配（服务端转义），不当作通配符——与作品搜索同一口径。
        - name: includeDeprecated
          in: query
          schema: { type: boolean, default: false }
          description: 是否包含上游已弃用的条目
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: |
            跳过多少条。响应里的 `total` 是同一组筛选条件下的总数，
            所以「第几页 / 共几页」由调用方自己算，接口不替它做除法。
      responses:
        '200':
          description: 目录条目（含 `total`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogList'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 model.import 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/models/import/preview:
    post:
      operationId: previewModelImport
      tags: [治理]
      summary: 导入 / 补全的字段级差异
      description: |
        给定一条上游目录条目，算出「本地当前值 / 上游值 / 当前来源 / 是否锁定 / 能不能勾」。

        三种模式由数据决定，不由调用方声明：
        - **新建**：没有本地模型认领这条上游条目，`mode = 'create'`，差异里 `current` 全空。
        - **补全**：已有本地模型认领，`mode = 'complete'`，逐字段给出当前值与来源。
        - **冲突**：这条上游条目被另一个模型占着且对方不可合并，`mode = 'conflict'`，
          附 `conflictWith`；调用方不该继续。

        哪些字段**不可勾选**（模型域 §4.6.5）：值相同（no-op）、`source = 'manual'`、
        `locked = true`。后两者要显式解锁才能覆盖，接口不代劳。

        需要 `model.import` 权限。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelImportRef'
      responses:
        '200':
          description: 差异
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelImportPreview'
        '400':
          description: 请求体不合法（缺少 providerId / externalId）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 model.import 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 目录里没有这条上游条目（先刷新目录）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 该上游条目已被另一个模型认领
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/models/import/apply:
    post:
      operationId: applyModelImport
      tags: [治理]
      summary: 应用导入 / 补全
      description: |
        把勾选的字段写进本地：新建时先落一个 `status = 'active'` 的模型（有人对着上游条目
        点过，不是作者随手填的 `candidate`），再写 `model_specs`、逐字段
        `model_spec_fields(source='models.dev')`、`model_external_refs` 与审计。

        **只写 `fields` 里列出的字段**：没勾的保持原样。上游字段消失时不清空本地值
        （模型域 §4.6.8），只会在 preview 里标「上游已移除」。

        单条独立事务：批量导入由调用方逐条发，一条失败不影响其它条。

        需要 `model.import` 权限。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelImportApply'
      responses:
        '200':
          description: 应用后的模型对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: 请求体不合法（字段名不在白名单 / 一个字段都没勾）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 model.import 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 目录里没有这条上游条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 该上游条目已被另一个模型认领
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/models/import/apply-batch:
    post:
      operationId: applyModelImportBatch
      tags: [治理]
      summary: 批量应用导入 / 补全
      description: |
        `apply` 的批量版：一次最多 50 条，每条**各自一个事务**，逐条返回结果。

        为什么不做整批回滚：第一次导入就是几十条起步，第 17 条撞「已被认领」时
        前 16 条白做，管理员得重新勾一遍。而「逐条结果」让他只重试失败那几条。
        代价是这一批不是原子的——`results` 里 `failed` 的那些确实没落库。

        **批内同一个上游条目（`providerId` + `externalId`）出现两次直接 400 整批拒绝**：
        那是拼装请求的 bug，静默去重会让「我勾了两次」看起来像成功。

        字段名不在白名单、或某条一个字段都没勾，同样按 400 整批拒绝——那是调用方
        的请求形态问题，不是某一条数据的运气问题。

        需要 `model.import` 权限。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelImportBatchRequest'
      responses:
        '200':
          description: 逐条结果（整体成功；条目的失败在 results 里）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelImportBatchResult'
        '400':
          description: 请求体不合法（超过 50 条 / 批内重复 / 未知字段 / 某条空勾选）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 model.import 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/reviews/demo:
    get:
      operationId: listDemoReviewQueue
      tags: [治理]
      summary: 待审作品队列
      description: |
        只列 `moderation_state = 'pending'` 的作品，按提交时间正序（先来先审）。

        需要 `demo.review` 权限。权限来自 `accounts.role` 经 `role_permissions` 展开，
        **不是**「登录了就能看」——审核队列里有未公开内容，见预览端口径。

        队列项带 `previewPath`：审核员用它打开作品内容（该路径对持 `demo.review`
        的角色开放未发布作品，见 `GET /preview/{slug}/v{rev}/{path}`）。
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.review 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/reviews/demo/{slug}:
    post:
      operationId: reviewDemo
      tags: [治理]
      summary: 审核裁决
      description: |
        把作品从 `pending` 推到 `approved` 或 `rejected`。

        **只有 `pending` 能裁决**：已经裁决过的一律 409。这不是为了省事——
        `approved → 其它` 会被 `trg_demos_guard` 拦住（有 `listed` 渠道时不允许撤下），
        与其让调用方撞数据库异常，不如在这里明确拒绝，并指向「下架」那个端点。

        裁决与两处留痕在**同一个事务**里：`demo_timeline`（写给人看的经过）与
        `audit_log`（谁、什么时候、改前改后）。任何一处失败整体回滚——
        「状态改了但没人知道是谁改的」比「没改」更难查。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: 已裁决
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400':
          description: 请求体不合法（决定值不在枚举内 / reason 过长）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.review 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 该作品不处于待审状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/demos/{slug}/publish:
    post:
      operationId: publishDemo
      tags: [治理]
      summary: 发布作品
      description: |
        把作品从 `draft`（或 `archived`，即作者下架后恢复）推到 `published`，
        并在同一个事务里落一行 `demo_channels`。

        **审核通过 ≠ 已发布**（Demo 域 §6.1）：`moderation_state='approved'` 只说明
        内容合规，`lifecycle_state` 与渠道行才决定它对外能不能看到。这个端点只做后者。

        拒绝的三种情况，分开返回：
        - 作品不存在（含软删、擦除）→ 404
        - 内容还没通过审核 → 409，`message` 指明「先审」
        - 已经是 `published` → 409（同渠道重复发布不叠加）
        - 追加到**另一个渠道**（如 deep 之后再加 astra）当前不支持：本端点只接受
          `draft` / `archived` 状态，发布一次后状态即为 `published`。要加第二渠道得
          新增一个「上架到渠道」端点，见已知松点
        - `removed`（违规下架）→ 409，只能走申诉，不能直接发

        `visibility='listed'` 还要求父作品 `approved`——已在上面的 409 里挡过；
        数据库的 `trg_demo_channels_listed_requires_approved` 是兜底，不是第一道。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '400':
          description: 请求体不合法（渠道为空 / 可见性不在枚举内 / lang 不在枚举内）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.publish 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态不允许发布（未审核 / 已发布 / 已违规下架）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [not_found, invalid_param, forbidden, unauthorized, conflict, rate_limited, unavailable, verification_required, email_not_verified, payload_too_large, restore_window_closed, derivative_purged]
          description: 机器可判别的错误码；`message` 只给人看，不要拿来做判断
        message:
          type: string
          description: 中文说明，可直接展示

    Healthz:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ClassificationRef:
      type: object
      additionalProperties: false
      required: [dimension, slug, label]
      properties:
        dimension:
          type: string
          enum: [genre, technique, subject]
          description: 维度的合法取值由 `classification_dimensions` 定义，不是开放字符串
        slug:
          type: string
          maxLength: 64
          description: |
            稳定标识。中文题材的 slug 就是中文原文（旧站的数据长这样，翻译会引入
            第二份无人维护的映射表）。URL 里由调用方 encode。
        label:
          type: string
          maxLength: 100
          description: 展示名。管理员可以改它，slug 不动——所以「改个名字」不会让链接失效

    Classification:
      allOf:
        - $ref: '#/components/schemas/ClassificationRef'
        - type: object
          additionalProperties: false
          required: [demoCount]
          properties:
            demoCount:
              type: integer
              minimum: 0
              description: |
                按这一项筛选会命中多少件**已发布**作品。口径与列表端点同源；
                为 0 表示还没有作品用它（新录入的分类就是这样）。
            description:
              type: string
              description: 说明，可为空串
            parentSlug:
              type: string
              nullable: true
              description: |
                父级 slug，只有 `genre` 会有（`game → FPS/肉鸽/跑酷`）。
                `subject` 与 `technique` 永远是 null——这不是没填，是形状约束：
                `ck_classifications_shape` 只允许 genre 带 parent。
            aliases:
              type: array
              items:
                type: string
              description: 别名，只有 `subject` 会有（「魔方」有「魔方模拟器」「三阶魔方」）

    DemoType:
      type: object
      description: |
        一个作品类型，以及它允许的上传形态。

        `formats` 里每一项都是「容器:入口」形式：`single:html` 是单文件 HTML，
        `zip:godot` 是 Godot 导出的 zip 包，`url` 表示不需要上传文件。
      required: [code, name, formats]
      properties:
        code:
          type: string
          description: 稳定标识，投稿时回传给服务端
        name:
          type: string
          description: 界面上的中文名
        formats:
          type: array
          description: 允许的上传形态；空数组表示这个类型还不收文件
          items:
            type: string

    DemoTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoType'

    ClassificationCatalog:
      type: object
      additionalProperties: false
      required: [dimensions, items]
      properties:
        dimensions:
          type: array
          description: |
            维度元数据，按 sort 排序。前端用它决定分组标题与顺序，
            不自己写死三个中文名——那会是第三份维度清单。
          items:
            type: object
            additionalProperties: false
            required: [dimension, label, mode]
            properties:
              dimension:
                type: string
                enum: [genre, technique, subject]
              label:
                type: string
              description:
                type: string
              mode:
                type: string
                enum: [fixed, open]
                description: |
                  `fixed` 是闭集，`open` 表示这个维度天然会长尾（目前只有 `subject`）。

                  **两个取值都不代表作者能自助新增词条**：投稿与更新时传的 slug 必须是
                  库里已有的，填一个不存在的会 400。`open` 说的是「维度本身开放增长」，
                  录入仍由管理员完成——自助提交待审那条路径尚未实现
                  （见 `docs/已知松点.md` 第 55 条）。
        items:
          type: array
          items:
            $ref: '#/components/schemas/Classification'

    ModelCatalogItem:
      type: object
      additionalProperties: false
      required: [providerId, providerName, externalId, name, canonicalId, vendorSlug, family, modelType, upstreamStatus, imported]
      properties:
        providerId:
          type: string
          maxLength: 128
          description: 上游的 provider 标识（`models.dev` 的 `provider_id`）
        providerName:
          type: string
          maxLength: 128
          description: 上游的 provider 展示名
        externalId:
          type: string
          maxLength: 200
          description: 上游条目 id（原文，含 `:free` 这类渠道标记）
        name:
          type: string
          maxLength: 200
          description: 上游展示名
        canonicalId:
          type: string
          description: 上游 canonical 标识（如 `deepseek/deepseek-v4-flash`）；上游没有时为空串
        vendorSlug:
          type: string
          description: 由 canonical 前缀推出的厂商 slug；为空表示要人工确认
        family:
          type: string
          description: 上游的模型家族；只落镜像，不进业务侧
        modelType:
          type: string
          description: 上游 `type`（chat / image / embedding …）；只落镜像
        upstreamStatus:
          type: string
          description: |
            上游自己的状态（`deprecated` / `beta` / `alpha`）。**不改我们的 `Model.status`**：
            上游弃用说的是「厂商不再维护」，我们弃用说的是「已合并到别的模型」。
        imported:
          type: boolean
          description: 这个上游条目是否已被某个本地模型认领
        contextWindow:
          type: integer
          nullable: true
          description: 上游给的上下文窗口；未知时为空
        maxOutput:
          type: integer
          nullable: true
          description: 上游给的最大输出；未知时为空
        costIn:
          type: number
          format: double
          nullable: true
          description: 输入单价（上游口径）
        costOut:
          type: number
          format: double
          nullable: true
          description: 输出单价
        releaseDate:
          type: string
          format: date
          nullable: true
          description: 发布日期
        modalityIn:
          type: string
          description: 输入模态（上游原文，逗号分隔）；未知时为空串
        modalityOut:
          type: string
          description: 输出模态
        description:
          type: string
          description: 上游描述
    ModelCatalogList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelCatalogItem'
        total:
          type: integer
          minimum: 0
          description: 同一组筛选条件下的总条数（不受 limit / offset 影响）
        limit:
          type: integer
          minimum: 1
          description: 本次请求的 limit，回显用
        offset:
          type: integer
          minimum: 0
          description: 本次请求的 offset，回显用

    RecommendationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: |
            按推荐得分从高到低，最多 `limit` 条。空数组表示「还不知道推荐什么」——
            没有种子（新用户）或候选全被排除了。界面应当整块不渲染，而不是显示空态文案：
            「暂无推荐」会让读者以为这是坏掉的，而不是还没开始。
          items:
            $ref: '#/components/schemas/DemoSummary'

    RelatedList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: |
            按相关性从高到低。`score` 与共用信号的明细不返回：界面只用来排序，
            而把「因为共用 3D建模」写出来会让读者以为这是审核结论。
          items:
            $ref: '#/components/schemas/DemoSummary'

    RankingEntry:
      type: object
      description: 榜单里的一个名次。
      required: [rank, value, demo]
      properties:
        rank:
          type: integer
          minimum: 1
          description: |
            连续名次（1 基）。同分也按附录 D 的稳定序编号，不跳号——
            「第 21 名」这种链接必须总能翻到东西。
        value:
          type: number
          format: double
          description: |
            这个榜用来排序的那个数，含意随 `board` 变（分数 / 票数 / 净票 / 热度分）。
            摆出来是为了让读者能自己复核名次，不是让人改。
        demo:
          $ref: '#/components/schemas/DemoSummary'

    RankingList:
      type: object
      required: [board, range, items, total]
      properties:
        board:
          type: string
          enum: [avg, god, ghost, net, count, heat]
          description: 回显口径——前端据此决定单位文案，不用自己记请求参数。
        range:
          type: string
          enum: [all, week, month]
          description: 回显时间范围。
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntry'
        total:
          type: integer
          minimum: 0
          description: |
            这个榜在这个范围里有多少件作品，与实际能翻到的条数一致；。
            与 `items` 长度不同是因为分页，不是因为口径差异。

    ModelProfile:
      type: object
      additionalProperties: false
      required: [model, specs, site, demos, providers, benchmarks]
      properties:
        model:
          $ref: '#/components/schemas/Model'
        specs:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModelSpecs'
        site:
          $ref: '#/components/schemas/ModelSiteStats'
        demos:
          type: array
          description: 用了这个模型的**公开**作品，按创建时间倒序
          items:
            $ref: '#/components/schemas/ModelDemoRef'
        providers:
          type: array
          description: provider 分布；`providerId` 为空的行是「来源未标注」，排在最后
          items:
            $ref: '#/components/schemas/ModelProviderSlice'
        benchmarks:
          type: array
          description: |
            第三方基准里**参与综合分资格**的条目（榜单与版本都 active、`coverage=full`、
            非自报、有 primary 指标、有名次、参赛数 ≥ 3）。不满足的留在库里但不进这里。
          items:
            $ref: '#/components/schemas/ModelBenchmarkScore'

    ModelSpecs:
      type: object
      additionalProperties: false
      description: |
        档案（`model_specs`）。**没有档案时整个字段是 null**，不是空对象——
        「还没录入」与「录了但每一栏都空」对读者的意义不同。
        有档案时逐字段可空：缺值由界面显示 `—`，不要显示 0。
      properties:
        contextWindow: { type: integer, nullable: true }
        maxOutput: { type: integer, nullable: true }
        paramTotalB: { type: number, format: double, nullable: true }
        paramActiveB: { type: number, format: double, nullable: true }
        paramKind: { type: string }
        paramNote: { type: string }
        releaseDate: { type: string, format: date, nullable: true }
        knowledgeCutoff: { type: string, nullable: true }
        openWeights: { type: integer, nullable: true }
        costIn: { type: number, format: double, nullable: true }
        costOut: { type: number, format: double, nullable: true }
        license: { type: string, nullable: true }
        modalitiesIn: { type: string }
        modalitiesOut: { type: string }
        source: { type: string, description: 档案来源（`models.dev` / `manual` 等） }
        fetchedAt: { type: string, format: date-time, nullable: true }
        note: { type: string }

    ModelSiteStats:
      type: object
      additionalProperties: false
      required: [demoCount, votes, scored, score, priorWeight]
      properties:
        demoCount:
          type: integer
          description: 公开作品数（与作品库 `?model=<slug>` 的条数同源）
        votes:
          type: integer
          description: 这些作品的评分票数合计
        scored:
          type: boolean
          description: 有票才为 true。false 时 `score` 没有意义（仍给 0，界面不该显示）
        score:
          type: number
          format: double
          description: 社区分（贝叶斯收缩）。见 `priorWeight`
        priorWeight:
          type: number
          format: double
          description: 收缩用的 `m`：各模型票数中位数，下限 1

    ModelDemoRef:
      type: object
      additionalProperties: false
      required: [slug, title, createdAt, ratingAverage, ratingCount]
      properties:
        slug: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        ratingAverage: { type: number, format: double }
        ratingCount: { type: integer }

    ModelProviderSlice:
      type: object
      additionalProperties: false
      required: [providerSlug, providerName, demoCount, votes]
      properties:
        providerId: { type: integer, nullable: true }
        providerSlug: { type: string, description: 空串表示未标注 }
        providerName: { type: string }
        demoCount: { type: integer }
        votes: { type: integer }
        avgRating:
          type: number
          format: double
          nullable: true
          description: 只做参考，**不参与**社区分；票数为 0 时为 null

    ModelBenchmarkScore:
      type: object
      additionalProperties: false
      required: [benchmarkSlug, benchmarkName, version, asOf, metricKey, metricLabel, rawScore]
      properties:
        benchmarkSlug: { type: string }
        benchmarkName: { type: string }
        version: { type: string }
        asOf: { type: string, format: date }
        participantCount: { type: integer, nullable: true }
        sourceUrl: { type: string }
        metricKey: { type: string }
        metricLabel: { type: string }
        unit: { type: string }
        rawScore: { type: number, format: double }
        rank: { type: integer, nullable: true }

    ModelSyncStatus:
      type: object
      additionalProperties: false
      required: [source, status, items]
      properties:
        source:
          type: string
          description: 来源标识，当前恒为 `models.dev`
        status:
          type: string
          description: |
            `ok` / `stale` / `failed` / `never`。见端点描述——故意不是 enum。
        items:
          type: integer
          minimum: 0
          description: 上一次成功同步落库的条目数；从未成功过是 0
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: 上一次**尝试**的时间（成功与失败都算）
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          description: 上一次**成功**的时间。失败不会覆盖它——这是判断「镜像有多旧」的依据
        error:
          type: string
          nullable: true
          description: 上次失败的原因；成功或从未同步时为 null
    ModelSyncResult:
      type: object
      required: [source, status, items, skipped, syncedAt]
      properties:
        source:
          type: string
          description: 来源标识，当前固定 `models.dev`
        status:
          type: string
          description: |
            同步后的状态，取值为 `ok` / `stale` / `failed`。
            故意不是 enum：与 `model_source_sync.status` 同一取值集，
            在门禁里核对，避免生成器把全仓枚举常量改名（见松点 53）。
        items:
          type: integer
          format: int64
          description: 镜像里的条目数（`skipped=true` 时是上一次成功的条数）
        skipped:
          type: boolean
          description: payload 指纹与上一次成功相同，因此没有重写镜像
        syncedAt:
          type: string
          format: date-time
          description: 这次同步的完成时间（`skipped=true` 时是本次检查时间）

    ModelImportRef:
      type: object
      additionalProperties: false
      required: [providerId, externalId]
      properties:
        source:
          type: string
          default: models.dev
          description: 上游来源；目前只有 models.dev
        providerId:
          type: string
          maxLength: 128
          description: 上游 provider 标识
        externalId:
          type: string
          maxLength: 200
          description: 上游条目 id
        canonicalId:
          type: string
          description: 上游 canonical 标识；用来命中「同一模型的其他 provider 条目」
    ModelImportField:
      type: object
      additionalProperties: false
      required: [field, current, upstream, source, locked, selectable]
      properties:
        field:
          type: string
          description: |
            字段名，取值集合见 `POST /api/v1/admin/models/import/preview` 返回的 `fields`：
            `name` / `description` / `contextWindow` / `maxOutput` / `costIn` / `costOut` /
            `releaseDate` / `knowledgeCutoff` / `openWeights` / `modalityIn` / `modalityOut` /
            `license`。

            这里**故意不写成 enum**：`description` 与 `DemoSummary.matchedIn` 的取值重名，
            而 oapi-codegen 遇到跨枚举的重名常量时会把全仓所有枚举常量改成带类型前缀的
            形式（`api.Unavailable` → `api.ErrorCodeUnavailable`）。服务端的白名单
            （`specFieldNames`）是这份取值集合的事实源，未知字段回 400。
        current:
          type: string
          description: 本地当前值（新建时为空串）
        upstream:
          type: string
          description: 上游值
        source:
          type: string
          description: |
            当前离线值是谁写的：`manual` / `models.dev` / `none`（本地还没有值）。

            这里**故意不写成 enum**：它与 `Model.source` 的取值几乎重叠，一旦两个枚举
            同名取值并存，生成器会把全仓的枚举常量改成带类型前缀的名字（`api.Unavailable`
            → `api.ErrorCodeUnavailable`），那是为了一个描述性字段付的全局代价。
        locked:
          type: boolean
          description: 是否被人工锁定（`model_spec_fields.locked`）
        selectable:
          type: boolean
          description: |
            能不能勾。值相同（no-op）、`source = manual`、`locked = true` 三种情况都是 false——
            接口不替调用方解锁。
    ModelImportBatchRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 一次最多 50 条；批内同一个上游条目出现两次整批 400
          items:
            $ref: '#/components/schemas/ModelImportApply'

    ModelImportBatchResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          description: 与请求 items 一一对应、顺序相同
          items:
            $ref: '#/components/schemas/ModelImportBatchResultItem'

    ModelImportBatchResultItem:
      type: object
      additionalProperties: false
      required: [providerId, externalId, status]
      properties:
        providerId:
          type: string
        externalId:
          type: string
        status:
          type: string
          description: |
            `created`（新建）/ `completed`（补全已有模型）/ `failed`。
            故意不是 enum：写成 enum 会让生成器给全仓枚举常量加类型前缀，
            与 `ModelSyncResult.status` 同一个理由（见松点 53）。
        model:
          $ref: '#/components/schemas/Model'
        error:
          type: string
          description: 失败原因（成功时为空串）

    ModelImportPreview:
      type: object
      additionalProperties: false
      required: [mode, fields]
      properties:
        mode:
          type: string
          description: |
            `create`（新建）/ `complete`（补全）/ `conflict`（上游条目已被别的模型占着）。

            这里**故意不写成 enum**：`conflict` 与错误码 `ErrorCodeConflict` 撞名，而
            oapi-codegen 遇到跨枚举的重名常量时，会把全仓所有枚举常量改成带类型前缀的
            形式（`api.Unavailable` → `api.ErrorCodeUnavailable`）。为一个只有三个取值的
            描述性字段付这个全局代价不值得。
        target:
          $ref: '#/components/schemas/Model'
          description: 已匹配到的本地模型；`mode = create` 时不返回
        conflictWith:
          $ref: '#/components/schemas/Model'
          description: 占用该上游条目的模型；只有 `mode = conflict` 时返回
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ModelImportField'
    ModelImportApply:
      type: object
      additionalProperties: false
      required: [providerId, externalId, fields]
      properties:
        source:
          type: string
          default: models.dev
          description: 上游来源
        providerId:
          type: string
          maxLength: 128
          description: 上游 provider 标识
        externalId:
          type: string
          maxLength: 200
          description: 上游条目 id
        canonicalId:
          type: string
          description: 上游 canonical 标识
        name:
          type: string
          maxLength: 128
          description: |
            新建时的展示名（通常取上游 `name`，去掉 `:free` 这类渠道标记）。
            补全模式下被忽略——改展示名是另一件事。
        vendor:
          type: string
          maxLength: 64
          description: 新建时的厂商名；上游没有 canonical 时留空并在差异里标「需人工确认厂商」
        fields:
          type: array
          description: |
            要写入的字段名清单。**只写这里列出的**：没勾的保持原样。
            一个都没给按 400 处理——那多半是调用方漏了勾选结果，而不是想「什么都不改」。
          items:
            type: string
            # 取值与 `ModelImportField.field` 的 enum 逐字一致，但这里**不再写一遍 enum**：
            # 两份同值枚举并存时，生成器会给全仓每个枚举常量加上类型前缀
            #（`api.Unavailable` → `api.ErrorCodeUnavailable`），那是为一个数组元素
            # 付的全局代价。合法取值以 `ModelImportField.field` 为准。
    ModelRef:
      type: object
      additionalProperties: false
      required: [slug, name, vendor]
      properties:
        slug:
          type: string
          maxLength: 128
          description: 稳定可引用的模型标识（`models.slug`）
        name:
          type: string
          maxLength: 128
          description: 给人看的模型名
        vendor:
          type: string
          maxLength: 64
          description: 厂商名；未知时为空串

    # 模型目录里的一行（`GET /api/v1/models`）。详情里作者声明的模型也是这个形状——
    # 同一份数据在两张页面上长得不一样，是最容易被忽略的不一致。
    Model:
      allOf:
        - $ref: '#/components/schemas/ModelRef'
        - type: object
          additionalProperties: false
          required: [status, resolution, mergedIntoSlug, source, aliases, description]
          properties:
            status:
              type: string
              enum: [candidate, active, unverified, deprecated]
              description: |
                `candidate` 作者手动建、未核实；`active` 可用；`unverified` 认领了上游
                条目但来源可疑；`deprecated` 已退役。
            resolution:
              type: string
              enum: [exact, family, unknown, guess]
              description: |
                名称的精确度。`exact` 是确切的型号；`family` 只到系列；`unknown` /
                `guess` 是兜底实体（作者说不清具体用了什么）。
            mergedIntoSlug:
              type: string
              description: |
                合并归宿的 slug；没被合并时为空串。**只在 `status = deprecated` 时有值**。

                这里给「归宿」而不是替调用方解析过去：作者当初声明的就是这一个，
                服务端悄悄换成别的会让「我明明写的是这个」变成另一种东西。
            source:
              type: string
              enum: [manual, models.dev]
              description: |
                这条是从哪来的，**派生值**：有 `model_external_refs` 行就是 `models.dev`
                （被上游目录认领过），否则 `manual`（人工建/导入）。
                它不是 `models` 表上的列——同一件事不该有两个出处。
            aliases:
              type: array
              description: |
                这个模型的其他写法（`model_aliases`）。用它可以把作者手填的名字
                解析回来，也用于展示「同一个模型在别处叫什么」。

                别名是**解析入口**，不是展示字段：同一条会被多个模型共享是数据错误，
                所以它反过来是 `alias` 单列主键。
              items:
                type: string
            description:
              type: string
              description: 人工说明；没有时为空串

    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    # 作品作者（`DemoDetail.author`）。它曾经叫 ModelAuthor，和旁边的 ModelRef /
    # ModelList 同前缀，读起来像「模型的作者」——它跟模型域没有任何关系。
    DemoAuthor:
      type: object
      additionalProperties: false
      required: [username, displayName]
      properties:
        username:
          type: string
          maxLength: 20
          description: |
            用户名（不可变的标识）。作者注销后为空串——那时作品本身还留着，
            只是「谁写的」这个信息不再存在。
        displayName:
          type: string
          maxLength: 50
          description: 昵称；作者没设昵称时为空串，界面应当回退显示 `username`

    DemoRatingInput:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: 1–5 分，整数。没有 0.5 分这回事——评分是表态，不是测量。

    DemoRating:
      type: object
      additionalProperties: false
      required: [average, count]
      properties:
        average:
          type: number
          format: double
          minimum: 0
          maximum: 5
          description: 平均分，保留两位小数；**没有票时是 0**，不是 null
        count:
          type: integer
          minimum: 0
          description: 有效票数（撤销的不算）
        mine:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 当前调用者的分数；没打过是 null。匿名调用者同样有意义——他改分时界面要能回显

    DemoSummary:
      type: object
      additionalProperties: false
      required: [slug, title, coverUrl, createdAt, lifecycleState, matchedIn, classifications]
      properties:
        slug:
          type: string
          maxLength: 128
        classifications:
          type: array
          description: |
            这件作品的分类，按维度排好序（genre → technique → subject）。
            空数组表示没打分类，不表示加载失败。

            列表上带着它，是为了让卡片能直接标出「小游戏 · 3D建模」而不必为每张
            卡片再发一次请求。代价是列表响应变大——一条分类只有 slug + label 两个短字段。
          items:
            $ref: '#/components/schemas/ClassificationRef'
        title:
          type: string
          nullable: true
          maxLength: 200
          description: 墓碑态为 null
        coverUrl:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        matchedIn:
          type: string
          enum: [title, description]
          description: |
            这条结果是因为**标题**命中搜索词，还是只有**简介**命中。

            没有搜索词时恒为 `title`。只匹配简介时，列表上显示的标题里看不到关键词，
            界面必须标出来——否则用户会以为「搜出来的东西不相关」。

    DemoRevision:
      type: object
      additionalProperties: false
      required: [revNo, title, demoType, source, fileCount, totalBytes, createdAt, deleted, erased, isCurrent, isPublished]
      description: |
        版本列表里的一行。

        `isCurrent` 是作者正在改的那一版（可以是未过审的），`isPublished` 是访客正在看的那一版。
        两者在复审期间不同——这正是「改稿不等于下线」的实现方式。
      properties:
        revNo:
          type: integer
          minimum: 1
        title:
          type: string
        demoType:
          type: string
        source:
          type: string
          enum: [upload, url_import, rollback]
        fileCount:
          type: integer
        totalBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        erased:
          type: boolean
        isCurrent:
          type: boolean
        isPublished:
          type: boolean

    RevisionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoRevision'

    RestoreResult:
      type: object
      additionalProperties: false
      required: [slug, restoredFromRevNo, revisionNo, moderationState]
      description: 回滚的回执。回滚不是「撤销」，它追加了一个新版本，所以回执里同时有新版本号与来源版本号。
      properties:
        slug:
          type: string
        restoredFromRevNo:
          type: integer
          description: 内容取自哪一版
        revisionNo:
          type: integer
          description: 回滚产生的新版本号
        moderationState:
          type: string
          enum: [pending, approved, rejected]

    DemoTimelineEntry:
      type: object
      additionalProperties: false
      required: [kind, at]
      properties:
        kind:
          type: string
          description: |
            动作类型，取值 `create` / `approve` / `reject` / `publish` / `edit` /
            `rollback` / `archive` / `restore`（`slug_change` / `merge` 是预留值）。

            **故意不是 enum**：这个列表会随功能增加而增，而写 enum 会让
            oapi-codegen 给全仓枚举常量统一加类型前缀（`ModelImportField.source`
            那次就踩过）。客户端的正确写法是按未知值兜底。
        at:
          type: string
          format: date-time
          description: 发生时刻
        message:
          type: string
          nullable: true
          description: 一句话说明（例如「发布到 deep」）；没有就省略
        actorName:
          type: string
          nullable: true
          description: 操作人的显示名；账号被删或系统动作时为 null

    DemoTimeline:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoTimelineEntry'

    DemoDetail:
      allOf:
        - $ref: '#/components/schemas/DemoSummary'
        - type: object
          additionalProperties: false
          required: [description, updatedAt, demoType, downloadable, canEdit, lifecycleActions, viewCount, downloadCount, author, publishedAt, models, moderationState, rating]
          properties:
            description:
              type: string
              nullable: true
              description: 墓碑态为 null
            updatedAt:
              type: string
              format: date-time
            demoType:
              type: string
              description: |
                作品类型，取自 `demo_types` 主数据（`web` / `zip` / `link` / `image`）。
                墓碑态为空串——墓碑不承载内容，也就没有类型可言。
            canEdit:
              type: boolean
              description: |
                当前调用者能不能编辑这个作品（只有作者本人在非墓碑态下为 `true`）。

                作者视图与公开视图的差别不止这一列：

                - 作者看得到自己还没过审的稿件（公开视图对 `draft`/`pending`/`rejected` 一律 404）
                - 作者看到的 `title` / `description` / `demoType` 是**当前版本**的，
                  访客看到的是**对外版本**的——改稿期间两边内容不同是正常的
            isAuthor:
              type: boolean
              description: |
                当前调用者是不是作者本人。

                与 `canEdit` 不是一回事：`canEdit` 还要求「不是墓碑、没被平台移除」，
                而这个字段只回答「这是不是你的作品」——作品动态（
                `GET /api/v1/demos/{slug}/timeline`）就按它决定要不要请求。
                可选字段：老服务端不返回它时，前端按 `false` 处理。
            downloadable:
              type: boolean
              description: |
                这个作品现在能不能下载。

                `false` 的原因是**作品本身不该有下载**：墓碑态、外链作品（`link` 只给外链
                地址，不给本站包）、或者渠道对外不可见（`hidden`）。

                这里**不包含**「文件在存储里不见了」——那是事故，不是作品的属性。
                检测它需要每次详情都去存储里 `Stat` 一遍（一次额外的 IO 往返），
                而「文件丢了」的正确表现是下载时明确 404，不是详情页悄悄少一个按钮。

                前端据此决定出不出「下载作品」，**不要自己按 `demoType` 猜**——
                猜出来的按钮会点出 404。
            lifecycleActions:
              $ref: '#/components/schemas/DemoLifecycleActions'
            viewCount:
              type: integer
              format: int64
              minimum: 0
              description: |
                浏览数。同一个人（登录按账号、匿名按 IP 哈希）对同一作品
                同一个自然日在去重表里只留一行，所以刷新页面不会把它刷高。
                墓碑态与未发布的作品恒为 0——它们根本没有被计数的机会。
            downloadCount:
              type: integer
              format: int64
              minimum: 0
              description: 下载数。一次成功写出的下载 +1；被 404 挡下或传输中断不计。
            rating:
              $ref: '#/components/schemas/DemoRating'
            author:
              $ref: '#/components/schemas/DemoAuthor'
            publishedAt:
              type: string
              format: date-time
              nullable: true
              description: |
                第一次对外发布的时间，取该作品全部对外可见渠道里最早的一次
                `demo_channels.published_at`。

                没有对外可见的渠道时为 null（草稿、待审、以及从未发布过的作品）。
                它与 `createdAt` 是两件事：`createdAt` 是投稿那一刻，
                `publishedAt` 是「它第一次被人看到」——作者写完稿压一个月再发，
                这两个时间会差很远。

                墓碑态与已删除的作品也给：它曾经公开过，这个事实不该被抹掉。
            models:
              type: array
              description: |
                这一版声明的模型（`demo_revision_models`），按名字排序。

                - 访客看**对外版本**的声明，作者看**当前版本**的——与标题、简介同一口径
                - 空数组是正常状态：作品可以不声明模型（展示件未必用了模型）
                - 墓碑态恒为空数组：墓碑不承载内容，也就不承载「用了什么模型」
                - 本期只给名字，不给可点击的模型页链接（还没有那一页，给了就是死链）
                - 字段面与 `GET /api/v1/models` 的**每一项完全相同**（同一个 `Model`
                  schema）：同一份数据在两处长得不一样，前端就得写两套渲染
              items:
                $ref: '#/components/schemas/Model'
            moderationState:
              type: string
              enum: [pending, approved, rejected]
              description: |
                当前版本的审核态。

                - **作者看真实值**：`pending` / `approved` / `rejected`。作者必须能知道
                  自己那份稿子是等着、过了还是被退回，否则「投完就失联」。
                - **访客恒为 `approved`**：能看到的内容必然是已通过审核的对外版本；
                  回一个 `pending` 只会让人以为「这条作品还没审完就上线了」。

                注意它与 `lifecycleState` 是正交的两件事：审核态说的是**内容过没过**，
                生命周期说的是**这条作品对外是哪种档位**。一件 `published` 的作品在
                复审期间审核态是 `pending`，而对外内容仍在服务——那是版本分离的设计。

    DemoLifecycleActions:
      type: object
      additionalProperties: false
      required: [archive, unarchive, delete, restore]
      description: |
        当前调用者此刻能对这个作品做哪些生命周期动作。四个布尔全给，
        前端不需要再按 `lifecycleState` 自己推——推错的后果是「按钮点了 409」。

        判定放在服务端，因为它取决于三个变量的组合：是不是作者、有没有被删、
        是不是被平台移除。这三件事前端凑不齐（`deletedAt` 并不出现在响应里）。
      properties:
        archive:
          type: boolean
          description: 能下架（已发布、未删除、非平台移除）
        unarchive:
          type: boolean
          description: 能重新上架（已下架、未删除）
        delete:
          type: boolean
          description: 能删除（未删除、非平台移除）
        restore:
          type: boolean
          description: |
            能恢复（已删除、非平台移除）。

            这里**不**判定恢复窗口是否过期：那要查 GC 队列，而详情页每次请求都多一次
            队列查询不划算。窗口过期的正确表现是点「恢复」时收到 409
            `restore_window_closed`，页面上如实显示——比在详情页猜一个可能过期的数好。

    DemoLifecycleResult:
      type: object
      additionalProperties: false
      required: [slug, lifecycleState]
      properties:
        slug:
          type: string
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    DemoDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: 删除理由，进 `demos.delete_reason`，只给自己留个记录

    DemoDeleteResult:
      type: object
      additionalProperties: false
      required: [slug, lifecycleState, purgeAfter]
      properties:
        slug:
          type: string
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        purgeAfter:
          type: string
          format: date-time
          description: |
            最晚可恢复时刻。**在删除那一刻定型**（删除时刻 + 当时配置的
            `lifecycle.restore_window_days`），之后调整窗口参数不会改它——
            否则系统会承诺一件它在原定日期做不到的事。

    DemoList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
          description: 满足条件的总条数（不是当前页条数）

    SubmissionResult:
      type: object
      additionalProperties: false
      required: [slug, revisionNo, moderationState, lifecycleState]
      properties:
        slug:
          type: string
          maxLength: 128
          description: 生成的唯一标识，客户端用它跳详情页
        revisionNo:
          type: integer
          minimum: 1
        moderationState:
          type: string
          enum: [pending, approved, rejected]
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    MyDemoSummary:
      type: object
      additionalProperties: false
      description: |
        作者视角的一条作品。刻意不带简介 / 分类 / 浏览数：列表只需要回答
        「哪一件、什么状态、什么时候动过」，多取要 join 三张表，收益不大。
      required:
        [slug, title, coverUrl, createdAt, updatedAt, lifecycleState, moderationState, deletedAt, purgeAfter]
      properties:
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          nullable: true
          maxLength: 200
        coverUrl:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: 最近一次改动时间；列表按它倒序排
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        moderationState:
          type: string
          enum: [pending, approved, rejected]
          description: |
            当前版本的审核态，作者视角给真实值。
            与 `lifecycleState` 正交：`published` + `pending` = 复审中的已上线作品。
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            作者软删的时刻（`null` = 没删）。它与 `lifecycleState` 正交，
            所以判断「这条现在点不进去、但还能恢复」要看这一列而不是生命周期列。
        purgeAfter:
          type: string
          format: date-time
          nullable: true
          description: |
            这一行的内容被真正清掉的时刻（来自 `gc_queue`，删除那一刻定型）。
            `deletedAt` 为空时它一定为空；有它才说明恢复有期限。

    MyDemoList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyDemoSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0

    DemoChannelRequest:
      type: object
      additionalProperties: false
      required: [channel, visibility]
      properties:
        channel:
          type: string
          maxLength: 32
          description: 渠道 code，必须在 `channels` 里且启用
        visibility:
          type: string
          enum: [listed, unlisted, hidden]
          description: |
            `listed` 上列表、`unlisted` 可直链不上列表、`hidden` 不对读者可见。
            只有 `listed` / `unlisted` 算「对外可见」。
        lang:
          type: string
          enum: [zh, en]
          default: zh
          description: 这个渠道上的语言。`astra` 只收 `en`。

    DemoChannelResult:
      type: object
      additionalProperties: false
      required: [slug, channel, visibility, lang, created]
      properties:
        slug:
          type: string
          maxLength: 128
        channel:
          type: string
          maxLength: 32
        visibility:
          type: string
          enum: [listed, unlisted, hidden]
        lang:
          type: string
          enum: [zh, en]
        created:
          type: boolean
          description: 这次调用是否新建了渠道行（false = 更新了已有渠道的可见性）

    DemoChannel:
      type: object
      additionalProperties: false
      required: [channel, visibility, lang]
      properties:
        channel:
          type: string
          maxLength: 32
        visibility:
          type: string
          enum: [listed, unlisted, hidden]
        lang:
          type: string
          enum: [zh, en]

    DemoChannelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoChannel'

    LifecycleState:
      type: string
      description: |
        作品生命周期状态。与标准对象 §ST-2 的可见性档位对应：
        `draft` / `pending` / `rejected` 对外不可见；`published` 正常可见；
        `archived` / `removed` 可见但为墓碑态。
      enum: [draft, pending, published, rejected, archived, removed]

    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: 邮箱或用户名，不区分大小写

    PasswordResetCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        emailCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            邮箱验证码。只有在该标识符失败次数超阈值时才需要；
            平时传了也会被忽略。

        identifier:
          type: string
          description: 邮箱或用户名，不区分大小写
        password:
          type: string

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, username, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 只以 argon2id 哈希入库，接口从不回显
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
          description: 不区分大小写唯一（标准对象 §ID-2）
        displayName:
          type: string
          maxLength: 50
          description: 可为空串，展示时回退到 username

    RegisterAccepted:
      type: object
      additionalProperties: false
      required: [email, verificationSent]
      properties:
        email:
          type: string
          description: 回显注册用的邮箱，前端直接带到验证页
        verificationSent:
          type: boolean
          description: |
            验证信是否发出去了。`false` 表示账号建好了但 SMTP 没成功——
            前端应提示「去验证页点重新发送」，而不是当成注册失败。
            不要用它判断账号存不存在：账号一定存在（这个响应只在 201 出现）。

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^[0-9]{6}$'

    VerifyEmailResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    Me:
      type: object
      additionalProperties: false
      required: [sub, username, displayName, email, role, status, level, createdAt]
      properties:
        sub:
          type: string
          description: 对外不可变 ID（base32(128 bit)，26 字符），不暴露自增主键
        username:
          type: string
          maxLength: 20
        displayName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          description: 只有本人看得到自己的邮箱
        role:
          type: string
          description: 角色快照，权限判定不只看它
        status:
          $ref: '#/components/schemas/AccountStatus'
        level:
          type: integer
          minimum: 0
          description: 等级投影镜像，级数不封顶（EXP-001）
        createdAt:
          type: string
          format: date-time

    AccountStatus:
      type: string
      enum: [pending, active, suspended, banned, deleted]
      description: 账号状态取值域，见标准对象 §ST-1

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'

    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [slug, title, description, authorName, moderationState, submittedAt, previewPath]
      properties:
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        authorName:
          type: string
          nullable: true
          description: 作者显示名；作者已注销时（author_id 被 SET NULL）为 null
        moderationState:
          type: string
          enum: [pending]
        submittedAt:
          type: string
          format: date-time
        previewPath:
          type: string
          description: 作品入口的相对地址，审核员直接拼到本站域名后使用

    ReviewDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
          description: 给作者看的说明；驳回时应当写清哪里不合格

    ReviewResult:
      type: object
      additionalProperties: false
      required: [slug, moderationState]
      properties:
        slug:
          type: string
        moderationState:
          type: string
          enum: [approved, rejected]

    PublishRequest:
      type: object
      additionalProperties: false
      required: [channel, visibility]
      properties:
        channel:
          type: string
          minLength: 1
          maxLength: 32
          description: 必须是 channels 表里已登记且 status='active' 的码值
        visibility:
          type: string
          enum: [listed, unlisted, hidden]
        lang:
          type: string
          enum: [zh, en]
          default: zh

    PublishResult:
      type: object
      additionalProperties: false
      required: [slug, lifecycleState, channel, visibility]
      properties:
        slug:
          type: string
        lifecycleState:
          type: string
          enum: [published]
        channel:
          type: string
        visibility:
          type: string
          enum: [listed, unlisted, hidden]

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-demo_session
      description: |
        不透明随机串（不是 JWT）。`__Host-` 前缀由浏览器强制 `Secure` + `Path=/` +
        **不设 Domain**；设了 Domain 就等于把会话暴露给 `cdn.` 与 `*.sandbox.` 等
        所有子域（身份域 §11.1）。
