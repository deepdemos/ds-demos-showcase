openapi: 3.0.3

info:
  title: DeepDemos API
  version: 0.1.0
  description: |
    本文件是**接口的唯一事实源**。改接口先改这里，再跑生成，再改实现；不要手改生成目录。

    当前范围：站点可用性、作品列表与详情、身份（注册 / 登录 / 登出 / 我是谁 / 发验证码 /
    找回密码），共 10 个端点。实现全部已接入并有集成测试覆盖。

    这份描述会随端点增加而更新——它长期停在「三个端点」正是 `api/surface.json` 基线
    不自动成长的症状（见 `docs/已知松点.md` 第 18 条）。

    写成中文的部分是给人看的说明；`description` 会进入生成的注释，所以也写中文。

    **为什么是 3.0.3 而不是 3.1**：选 3.1 时没有验证工具链。实测 `oapi-codegen` v2.5.0
    至今不支持 3.1（上游 issue #373），3.1 的 `type: [string, 'null']` 写法会直接生成失败；
    若改用 3.0 的 `nullable` 关键字又会让文件既不是 3.1 也不是 3.0。
    两者取其一是干净的：降到 3.0.3。3.1 相对 3.0 的主要增益（webhooks、
    JSON Schema 2020-12 对齐）本项目当前一点没用到，降级不损失表达力。

servers:
  - url: /
    description: 同域反代（Nginx 静态 + Go API）

tags:
  - name: 系统
    description: 运行状态检查
  - name: 作品
    description: 作品列表与详情
  - name: 身份
    description: 会话与当前登录者

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [系统]
      summary: 站点可用性
      description: |
        返回站点是否可用。**不得携带任何配置值、账号信息或内部依赖细节**（SET-006）。
        核心资料暂不可访问时应当返回非 200，而不是 200 加一个字段说明——运行检查只看状态码。
      responses:
        '200':
          description: 站点可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthz'
        '503':
          description: 站点不可用（核心资料暂不可访问）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos:
    get:
      operationId: listDemos
      tags: [作品]
      summary: 作品列表
      description: |
        分页返回已公开的作品。分页参数口径与治理域 §P5 一致：默认 50，上限 200。
        超过上限直接 400，不静默截断——静默截断会让调用方以为拿到了全部。
      parameters:
        - name: q
          in: query
          description: 关键词，匹配标题与描述
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          description: |
            排序口径。目前只有「最新」一种——`hot` 需要热度数据（浏览/收藏/评分），
            那批指标还没落地，所以先不放进枚举：契约里有的值必须真能算出来。
          schema:
            type: string
            enum: [latest]
            default: latest
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoList'
        '400':
          description: 参数非法（含 pageSize 超上限）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: submitDemo
      tags: [作品]
      summary: 投稿（multipart，连文件一起上传）
      description: |
        需要登录。一次请求同时提交元数据与作品文件，由服务端校验、解压、落库、上传。

        **为什么是后端中转而不是预签名直传**：直传有三个失败点（签名过期、传一半断、
        确认丢失），每个都要额外清理孤儿对象；本期没有带宽压力，中转把失败点收敛成一个。
        等带宽成为瓶颈时再换，契约形状不用改——客户端仍然是「一次提交」。

        `package` 支持两种形态：
        - 一个 zip 包，**包根必须有 `index.html`**
        - 单个 `.html` / `.svg` 文件

        服务端闸门（数值见 `docs/运行手册-可变常量.md` §3）：包体积、解压后体积、
        成员数、压缩比四道，任一不过即 422。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, demoType, package]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                demoType:
                  type: string
                  maxLength: 32
                  description: |
                    作品类型。取值见 `demo_types` 表——它是主数据，**加一种类型是加一行
                    数据，不是改契约**，所以这里不定 enum。
                package:
                  type: string
                  format: binary
                  description: 作品文件（zip 或单个 html/svg）
      responses:
        '201':
          description: 已接收，进入待审核（对外不可见）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: 参数非法（缺字段、标题过长、类型未知）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 包体积超过上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 文件类型不支持（既不是 zip 也不是 html/svg）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 包内容不合格（缺 index.html、压缩炸弹、成员过多等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 存储或数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/demos/{slug}:
    get:
      operationId: getDemo
      tags: [作品]
      summary: 作品详情
      description: |
        `slug` 的格式与长度来自 `db/schema/30-demo.sql` 的 `ck_demos_slug_len`（1–128）。

        **404 的语义要和墓碑口径一致**：曾经公开过、后来被作者归档或被管理员移除的作品，
        仍然返回 200 的墓碑态（标题等字段可空、带 `lifecycleState`），不返回 404；
        只有「从未公开过」或「已擦除」才返回 404。
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 详情；曾公开过但已归档/移除的返回墓碑态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDetail'
        '404':
          description: 不存在，或从未公开过，或已擦除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags: [身份]
      summary: 注册
      description: |
        建账号并直接给一个会话——注册完就是登录态，前端不需要再调一次登录。

        **邮箱与用户名都不区分大小写判重**（数据库上是 `lower(...)` 唯一索引），
        所以 `Alice` 与 `alice` 会撞 409，而不是建出两个账号。

        密码只以 argon2id 哈希入库，接口从不回显。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功，`Set-Cookie` 下发会话
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: 输入不合法（邮箱格式、密码长度、用户名规则）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 邮箱或用户名已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [身份]
      summary: 登录
      description: |
        `identifier` 可以是邮箱或用户名，都不区分大小写。

        **失败一律 401，不区分「没这个账号」与「密码错」**——区分了就等于提供一个
        免费的账号枚举接口。标识符不存在时也会跑一次同等代价的哈希校验，避免用
        响应时间把注册邮箱探出来。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，`Set-Cookie` 下发新会话
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: 账号或密码为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            账号或密码不对（不区分「没这个账号」与「密码错」）。

            当这个标识符在 10 分钟内失败达到 5 次时，服务端会要求邮箱验证码：
            此时即使密码正确也返回 401，`code` 为 `verification_required`。
            该判定**只看标识符的失败次数，不看账号是否存在**——所以它不能用来
            判断某个邮箱有没有注册过。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 尝试太频繁（身份域 §11.3 的三层限流）
          headers:
            Retry-After:
              schema: { type: integer }
              description: 建议等待的秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/email-code:
    post:
      operationId: postAuthEmailCode
      tags: [身份]
      summary: 申请登录验证码
      description: |
        `identifier` 与登录时填的一致（邮箱或用户名，不区分大小写）。

        **无论该标识符有没有对应账号，都返回 204**——账号不存在时不发信，但响应形状
        完全相同，否则这里就成了免费的账号枚举接口。

        发送频率限制在 1 次/分钟、5 次/小时；超限返回 429，这个也只看标识符，
        与账号是否存在无关。

        验证码投递到该账号的**主邮箱**，6 位数字，5 分钟内有效，一次性。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 已受理（不表示账号存在，也不表示信件一定送达）
        '400':
          description: 标识符为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库或邮件通道不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset/code:
    post:
      operationId: postAuthPasswordResetCode
      tags: [身份]
      summary: 申请找回密码验证码
      description: |
        只认**邮箱**，不认用户名——用户名是公开的，用它发起重置等于给攻击者
        一个「知道昵称就能骚扰到人」的入口。

        **无论该邮箱有没有注册，都返回 204**：不存在的邮箱同样会走一遍生成与
        频率限制，只是不投递。响应形状与账号是否存在无关。

        验证码发到主邮箱，6 位数字，5 分钟有效，一次性。与登录验证码**不能混用**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCodeRequest'
      responses:
        '204':
          description: 已受理（不表示邮箱注册过，也不表示信件一定送达）
        '400':
          description: 邮箱格式不对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 发送太频繁
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库或邮件通道不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [身份]
      summary: 用验证码重设密码
      description: |
        验证码、改密码、吊销旧会话在**同一个事务**里完成。

        成功后该账号在本次重置之前签发的**所有会话立即失效**——这是「密码可能
        已经泄露」场景下的关键一步，只改哈希不踢会话等于没改。

        验证码错误、过期、超次数、邮箱不存在，一律 401，不区分原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已重置，旧会话全部失效
        '400':
          description: 邮箱格式不对、新密码长度不合格或验证码为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 验证码不对或已失效（不区分具体原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [身份]
      summary: 登出
      description: |
        吊销服务端会话并清掉 cookie。**幂等**：没带 cookie、会话已失效、ID 是伪造的，
        一律返回 204——登出失败对用户没有可执行的动作，而「这个会话不存在」
        又是一个可以拿来做探测的信号。
      responses:
        '204':
          description: 已登出（无论之前是否有有效会话）

  /api/v1/me:
    get:
      operationId: getMe
      tags: [身份]
      summary: 当前登录者
      description: |
        会话是**服务端**的：cookie 只装不透明串，服务端每次查 `web_sessions`，
        所以登出能让 cookie 立刻失效。「没带 cookie / 不存在 / 过期 / 已吊销」
        **故意都 401 且不区分**——区分了等于送一个免费的会话探测器。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 未登录或会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/reviews/demo:
    get:
      operationId: listDemoReviewQueue
      tags: [治理]
      summary: 待审作品队列
      description: |
        只列 `moderation_state = 'pending'` 的作品，按提交时间正序（先来先审）。

        需要 `demo.review` 权限。权限来自 `accounts.role` 经 `role_permissions` 展开，
        **不是**「登录了就能看」——审核队列里有未公开内容，见预览端口径。

        队列项带 `previewPath`：审核员用它打开作品内容（该路径对持 `demo.review`
        的角色开放未发布作品，见 `GET /preview/{slug}/v{rev}/{path}`）。
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.review 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/reviews/demo/{slug}:
    post:
      operationId: reviewDemo
      tags: [治理]
      summary: 审核裁决
      description: |
        把作品从 `pending` 推到 `approved` 或 `rejected`。

        **只有 `pending` 能裁决**：已经裁决过的一律 409。这不是为了省事——
        `approved → 其它` 会被 `trg_demos_guard` 拦住（有 `listed` 渠道时不允许撤下），
        与其让调用方撞数据库异常，不如在这里明确拒绝，并指向「下架」那个端点。

        裁决与两处留痕在**同一个事务**里：`demo_timeline`（写给人看的经过）与
        `audit_log`（谁、什么时候、改前改后）。任何一处失败整体回滚——
        「状态改了但没人知道是谁改的」比「没改」更难查。
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: 已裁决
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400':
          description: 请求体不合法（决定值不在枚举内 / reason 过长）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少 demo.review 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 作品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 该作品不处于待审状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [not_found, invalid_param, forbidden, unauthorized, conflict, rate_limited, unavailable, verification_required, payload_too_large]
          description: 机器可判别的错误码；`message` 只给人看，不要拿来做判断
        message:
          type: string
          description: 中文说明，可直接展示

    Healthz:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    DemoSummary:
      type: object
      additionalProperties: false
      required: [slug, title, coverUrl, createdAt, lifecycleState]
      properties:
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          nullable: true
          maxLength: 200
          description: 墓碑态为 null
        coverUrl:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    DemoDetail:
      allOf:
        - $ref: '#/components/schemas/DemoSummary'
        - type: object
          additionalProperties: false
          required: [description, updatedAt]
          properties:
            description:
              type: string
              nullable: true
              description: 墓碑态为 null
            updatedAt:
              type: string
              format: date-time

    DemoList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
          description: 满足条件的总条数（不是当前页条数）

    SubmissionResult:
      type: object
      additionalProperties: false
      required: [slug, revisionNo, moderationState, lifecycleState]
      properties:
        slug:
          type: string
          maxLength: 128
          description: 生成的唯一标识，客户端用它跳详情页
        revisionNo:
          type: integer
          minimum: 1
        moderationState:
          type: string
          enum: [pending, approved, rejected]
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'

    LifecycleState:
      type: string
      description: |
        作品生命周期状态。与标准对象 §ST-2 的可见性档位对应：
        `draft` / `pending` / `rejected` 对外不可见；`published` 正常可见；
        `archived` / `removed` 可见但为墓碑态。
      enum: [draft, pending, published, rejected, archived, removed]

    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: 邮箱或用户名，不区分大小写

    PasswordResetCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        emailCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            邮箱验证码。只有在该标识符失败次数超阈值时才需要；
            平时传了也会被忽略。

        identifier:
          type: string
          description: 邮箱或用户名，不区分大小写
        password:
          type: string

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, username, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 只以 argon2id 哈希入库，接口从不回显
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]+$'
          description: 不区分大小写唯一（标准对象 §ID-2）
        displayName:
          type: string
          maxLength: 50
          description: 可为空串，展示时回退到 username

    Me:
      type: object
      additionalProperties: false
      required: [sub, username, displayName, email, role, status, level, createdAt]
      properties:
        sub:
          type: string
          description: 对外不可变 ID（base32(128 bit)，26 字符），不暴露自增主键
        username:
          type: string
          maxLength: 20
        displayName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          description: 只有本人看得到自己的邮箱
        role:
          type: string
          description: 角色快照，权限判定不只看它
        status:
          $ref: '#/components/schemas/AccountStatus'
        level:
          type: integer
          minimum: 0
          description: 等级投影镜像，级数不封顶（EXP-001）
        createdAt:
          type: string
          format: date-time

    AccountStatus:
      type: string
      enum: [pending, active, suspended, banned, deleted]
      description: 账号状态取值域，见标准对象 §ST-1

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'

    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [slug, title, description, authorName, moderationState, submittedAt, previewPath]
      properties:
        slug:
          type: string
          maxLength: 128
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        authorName:
          type: string
          nullable: true
          description: 作者显示名；作者已注销时（author_id 被 SET NULL）为 null
        moderationState:
          type: string
          enum: [pending]
        submittedAt:
          type: string
          format: date-time
        previewPath:
          type: string
          description: 作品入口的相对地址，审核员直接拼到本站域名后使用

    ReviewDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
          description: 给作者看的说明；驳回时应当写清哪里不合格

    ReviewResult:
      type: object
      additionalProperties: false
      required: [slug, moderationState]
      properties:
        slug:
          type: string
        moderationState:
          type: string
          enum: [approved, rejected]

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-demo_session
      description: |
        不透明随机串（不是 JWT）。`__Host-` 前缀由浏览器强制 `Secure` + `Path=/` +
        **不设 Domain**；设了 Domain 就等于把会话暴露给 `cdn.` 与 `*.sandbox.` 等
        所有子域（身份域 §11.1）。
