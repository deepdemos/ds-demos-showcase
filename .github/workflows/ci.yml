name: CI

on:
  pull_request:
  push:
    branches: [dev, main, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 单文件行数门禁（>500 警告，>800 失败）
        run: node scripts/check-file-size.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::有文件超过 800 行，属于过耦合。先读 docs/development-workflow.md：先建 issue，再拆分修复，PR 关联 issue。"

  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: PR 门禁（issue / 标题类型 / 修改规模）
        run: node scripts/check-pr.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::PR 门禁失败。先读 docs/development-workflow.md：PR 必须关联 issue、单一类型、修改规模不超限；CI 红或发现 bug 必须先建 issue。"
