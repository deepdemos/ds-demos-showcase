name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main, release]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # 集成测试要真库。本地不设 TEST_DATABASE_URL 就自动 skip，谁都不用装 PostgreSQL；
    # CI 里由这个 service 提供，并在下面先灌一遍 db/schema/*.sql。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepdemos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      # 分层门禁放 gofmt 之后：格式先过关，再看结构。
      # 规则与「它抓不到什么」见 docs/后端分层约定.md。
      # 本 job 默认在 backend/ 下跑，而脚本在仓库根。注意：step 级 working-directory
      # 是相对 $GITHUB_WORKSPACE 解析的，写 `..` 会跑到仓库外（实测报 Cannot find module）。
      - name: 分层门禁（platform / domain / httpapi 的 import 方向）
        working-directory: ${{ github.workspace }}
        run: node scripts/check-layering.mjs
      - name: vet
        run: go vet ./...
      - name: 准备测试库（跑迁移）
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deepdemos?sslmode=disable
        run: go run ./cmd/migrate up
      - name: test（含集成测试）
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deepdemos?sslmode=disable
        # -p 1：集成测试各包共用同一个测试库，而有的用例会 `DELETE FROM accounts` 清场。
        # 并行跑包时它们会互相把对方刚建的数据删掉（实测：身份域的验证码用例偶发
        # 「投递信息不对: To 为空」）。串行是这里最便宜的隔离方式，后端测试量很小。
        run: go test -race -p 1 ./...
      - name: build
        run: go build ./...
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败（含后端分层越界：platform 依赖业务、domain 依赖 HTTP、域之间互相 import，约定见 docs/后端分层约定.md）。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 门禁脚本自检
        run: node --test scripts/*.test.mjs
      - name: 单文件行数门禁（>500 警告，>800 失败）
        run: node scripts/check-file-size.mjs
      - name: 标准对象门禁（跨域取值域只允许定义一次）
        run: node scripts/check-objects.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::file-size 失败（有文件超过 800 行 / 标准对象取值域出现重复或走样 / 门禁脚本自检失败）。先读 docs/development-workflow.md：先建 issue，再拆分修复，PR 关联 issue。"

  # 契约门禁：目录表是唯一事实源——权限键、审计动作、审计实体类型、GC 对象类型，
  # 以及生命周期 registry.yaml 对它们的引用；表结构与可变常量两道静态门禁；
  # 外加一道**真库**校验（PGlite / PG 18 wasm：把 db/schema/*.sql 灌进去逐条断言）。
  # 以及一道契约生成校验：重新跑 oapi-codegen（Go）与 orval（前端），产物与 api/openapi.yaml 不一致就红。
  # 静态与真库的分工：静态证明「文件之间互相对得上」，真库证明「数据库真的会拒绝」。
  # 2026-11-01 起是 required check（ruleset protect-dev / protect-main-release 已加入），
  # 红了就不能合并。
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # 根 package.json 只给仓库工具用（唯一依赖是 @electric-sql/pglite，零传递依赖）；
      # 前端仍走 web/ 下的 pnpm。两者互不影响，见 docs/development-workflow.md「契约门禁」。
      - name: 安装仓库工具依赖
        run: npm ci
      - name: 门禁脚本自检
        run: node --test scripts/*.test.mjs
      - name: 契约门禁（权限键 / 审计动作 / 审计实体类型 / GC 对象类型）
        run: node scripts/check-contracts.mjs
      - name: 表结构门禁（db/schema 静态检查 + 文档里不许再手写 DDL）
        run: node scripts/check-schema.mjs
      - name: 可变常量门禁（运行手册里每个「唯一改动点」锚点必须还活着）
        run: node scripts/check-constants.mjs
      - name: 迁移门禁（命名 / 序号连续 / 校验和；改已合入的迁移会红）
        run: node scripts/check-migrations.mjs
      - name: 真库校验（PG 18：白名单外键 / 类型 / 枚举 / 级联 / 审计路由模板）
        run: node scripts/verify-schema.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 安装 oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
      # 重新生成一遍再比 diff：这是「禁止手改生成目录」唯一可执行的实现。
      # 版本与 api/README.md 里写的 go install 版本必须一致，否则产物会漂。
      - name: 接口契约须与生成产物一致（Go）
        run: |
          cd api
          "$(go env GOPATH)/bin/oapi-codegen" -config oapi-codegen-types.yaml openapi.yaml
          "$(go env GOPATH)/bin/oapi-codegen" -config oapi-codegen-server.yaml openapi.yaml
          cd ..
          git diff --exit-code backend/internal/api
      # 兼容门禁放这一步之后：先确认生成物是最新的，再拿它跟基线比。
      # 比的是 Go 类型表面而不是 YAML —— 判定表与「抓不到什么」见 api/COMPATIBILITY.md。
      - name: 契约兼容门禁（不许删字段 / 删枚举值 / 可空变必填）
        run: node scripts/check-api-compat.mjs
      # 前端客户端同理：orval 版本钉在脚本里（根 package.json 的 gen:api:web），
      # 不放进 devDependencies 是因为 83 个传递依赖会让 lockfile 涨 1600 多行，过不了 pr-guard。
      - name: 接口契约须与生成产物一致（前端）
        run: |
          npm run gen:api:web
          git diff --exit-code web/src/api/gen
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 安装 sqlc
        run: CGO_ENABLED=0 go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - name: SQL 查询须与生成产物一致
        run: |
          cd backend
          "$(go env GOPATH)/bin/sqlc" generate
          cd ..
          git diff --exit-code backend/internal/store
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::contract 失败（七类之一：① 目录表与引用不一致——权限没绑全 admin、registry.yaml 引用了不存在的 kind 或 entity_type；② db/schema 静态检查不过，或文档里又出现了手写 DDL；③ 运行手册某条「唯一改动点」的锚点失效——文件被删或被改名；④ 真库校验失败——某条约束/外键/级联在 PG 18 上没生效，或 db/schema 在真库根本跑不起来；⑤ 生成产物与源不一致——改了 api/openapi.yaml 或 backend/db/queries/*.sql 却没重新生成，或手改了 backend/internal/api/、web/src/api/gen/、backend/internal/store/；⑥ 迁移文件命名/序号不对，或改了已合入的迁移（校验和对不上）；⑦ 契约出现破坏性变更——删了字段/枚举值、把可空改成必填、删了端点（判定表见 api/COMPATIBILITY.md，确认要有意破坏后再 --update 重签基线））。先读 docs/development-workflow.md：先改目录表种子，再让引用跟着改；CI 红或发现 bug 必须先建 issue。"

  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 收集改动文件清单（docs-only 与生成物豁免判定用）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json files --jq '.files[].path' > changed-files.txt
      - name: PR 门禁（issue / 标题类型 / 文件数）
        env:
          CHANGED_FILES_PATH: changed-files.txt
        run: node scripts/check-pr.mjs
      - name: PR 必须有晚于最新 commit 的 review 评论
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-review.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::PR 门禁失败。先读 docs/development-workflow.md：PR 必须关联 issue、单一类型、**手写部分**改动文件数不超限（生成物不计入，行数不限）、review 评论必须晚于最新 commit；CI 红或发现 bug 必须先建 issue；不确定的问题先 ask。"