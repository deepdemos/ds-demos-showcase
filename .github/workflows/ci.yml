name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main, release]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::CI 失败。先读 docs/development-workflow.md：CI 红或发现 bug 必须先提交 issue，再修复；PR 必须关联 issue。"

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 门禁脚本自检
        run: node --test scripts/checks.test.mjs
      - name: 单文件行数门禁（>500 警告，>800 失败）
        run: node scripts/check-file-size.mjs
      - name: 标准对象门禁（跨域取值域只允许定义一次）
        run: node scripts/check-objects.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::file-size 失败（有文件超过 800 行 / 标准对象取值域出现重复或走样 / 门禁脚本自检失败）。先读 docs/development-workflow.md：先建 issue，再拆分修复，PR 关联 issue。"

  # 契约门禁（文档级）：目录表是唯一事实源——权限键、审计动作、审计实体类型、GC 对象类型，
  # 以及生命周期 registry.yaml 对它们的引用。后端接上之后这里再扩「代码常量 ↔ 目录表」比对。
  # 目前不是 required check（ruleset 由管理员维护），但 PR 上会红。
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 门禁脚本自检
        run: node --test scripts/checks.test.mjs
      - name: 契约门禁（权限键 / 审计动作 / 审计实体类型 / GC 对象类型）
        run: node scripts/check-contracts.mjs
      - name: 表结构门禁（db/schema 静态检查 + 文档里不许再手写 DDL）
        run: node scripts/check-schema.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::contract 失败（目录表与引用不一致 / 权限没绑全 admin / registry.yaml 引用了不存在的 kind 或 entity_type）。先读 docs/development-workflow.md：先改目录表种子，再让引用跟着改；CI 红或发现 bug 必须先建 issue。"

  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 收集改动文件清单（docs-only 判定用）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json files --jq '.files[] | .path' > changed-files.txt
      - name: PR 门禁（issue / 标题类型 / 修改规模）
        env:
          CHANGED_FILES_PATH: changed-files.txt
        run: node scripts/check-pr.mjs
      - name: PR 必须有晚于最新 commit 的 review 评论
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-review.mjs
      - name: 失败处理指引
        if: failure()
        run: echo "::error title=CI 门禁::PR 门禁失败。先读 docs/development-workflow.md：PR 必须关联 issue、单一类型、修改规模不超限、review 评论必须晚于最新 commit；CI 红或发现 bug 必须先建 issue；不确定的问题先 ask。"